LX({id:'lx5',name:'JavaScript',t:'JavaScript (ringkas)',say:'Ini bahasa yang sudah kamu kenal! Ringkasannya di sini, materi lengkapnya ada di tab <b>JavaScript</b>.',
 intro:'JavaScript adalah satu-satunya bahasa yang dijalankan langsung oleh semua browser. Dengan Node.js, ia juga bisa jalan di server.',
 prof:[['Dibuat','1995, Brendan Eich, Netscape'],['Jenis','Ditafsirkan dan di-JIT oleh mesin seperti V8'],['Tipe','Dinamis'],['Paradigma','Multi: OOP berbasis prototipe, fungsional, event-driven'],['Dipakai untuk','Web (tampilan dan server), aplikasi desktop (Electron), mobile (React Native)'],['Kelebihan','Ada di mana-mana, ekosistem npm raksasa, tidak perlu pasang apa-apa untuk mulai'],['Kekurangan','Aturan konversi tipe yang mengejutkan, banyak cara untuk hal yang sama'],['Siapa yang pakai','Hampir semua perusahaan web']],
 run:['terminal','# Cara 1: di browser, tekan F12, buka tab Console\n# Cara 2: pasang Node.js dari nodejs.org, lalu:\nnode --version\nnode halo.js'],
 hello:['halo.js',[['console.log("Halo, dunia!");','Kita ingin program menampilkan sesuatu agar tahu ia hidup.','[[console.log]] mencetak ke konsol; teks dalam tanda kutip disebut string.','Pengecekan paling dasar: kode kamu jalan.']]],
 tour:['tur.js',[['const nama = "Pita";','Nilai yang tidak diganti.','[[const]] membuat variabel yang tidak bisa diisi ulang.','Kode lebih aman.'],['let umur = 5;','Nilai yang bisa berubah.','[[let]] boleh diubah nanti.','Menyimpan angka yang berubah.'],['if (umur > 3) console.log("besar");','Mengambil keputusan.','Jika kondisi benar, jalankan perintah.','Percabangan program.'],['for (let i = 0; i < 3; i++) console.log(i);','Mengulang tanpa menulis ulang.','Mulai 0, selama kurang dari 3, tambah 1.','Mencetak 0, 1, 2.'],['const kali2 = x => x * 2;','Fungsi pendek.','Fungsi panah: input x, hasil x dikali 2.','Dipakai di map, filter, dan event.'],['const daftar = [1, 2, 3].map(kali2);','Mengubah semua isi list.','[[map]] menerapkan fungsi ke tiap elemen, hasilnya array baru [2,4,6].','Gaya fungsional yang ringkas.'],['try { JSON.parse("{rusak"); } catch (e) { console.log("gagal"); }','Program tidak boleh mati hanya karena data jelek.','Coba jalankan; kalau error, lompat ke catch.','Penanganan error.']]],
 trap:['[[==]] membandingkan dengan konversi tipe. Biasakan [[===]].','[[var]] punya aturan scope lama; pakai [[let]] dan [[const]].','Angka desimal: [[0.1 + 0.2]] tidak persis 0.3 (ini terjadi di banyak bahasa).'],
 cmp:[['Jalan di','Browser, Node.js','Browser, Node.js'],['Tipe','Dinamis','Dinamis']],
 q1:['Mesin yang menjalankan JavaScript di Chrome dan Node.js bernama...',['V8','Gecko','Swift','CPython'],0,'V8 buatan Google dengan teknik JIT.'],
 q2:['Pemanggilan yang mencetak teks ke konsol adalah...',['[[print("x")]]','[[console.log("x")]]','[[echo "x"]]','[[Console.WriteLine("x")]]'],1,'Itu gaya JavaScript. Yang lain milik Python, PHP, dan C#.']}),
LX({id:'lx6',name:'TypeScript',t:'TypeScript',say:'TypeScript itu JavaScript yang <b>punya jaring pengaman</b>: salah tipe ketahuan sebelum dijalankan.',
 intro:'TypeScript adalah JavaScript ditambah tipe data. Kamu menulis [[.ts]], lalu kompilator mengubahnya menjadi JavaScript biasa.',
 prof:[['Dibuat','2012, Microsoft (Anders Hejlsberg dkk.)'],['Jenis','Ditranspilasi menjadi JavaScript'],['Tipe','Statis (opsional, bertahap)'],['Paradigma','Superset JavaScript: OOP, fungsional'],['Dipakai untuk','Aplikasi web besar, Angular, backend Node.js, Deno'],['Kelebihan','Error tipe ketahuan lebih awal, editor jadi pintar (autocomplete)'],['Kekurangan','Perlu langkah build, tipe yang rumit bisa membingungkan'],['Siapa yang pakai','Microsoft, Slack, Airbnb, banyak startup']],
 run:['terminal','npm install -g typescript\ntsc --version\ntsc halo.ts      # menghasilkan halo.js\nnode halo.js'],
 hello:['halo.ts',[['function sapa(nama: string): string {','JavaScript tidak tahu apakah nama itu teks atau angka.','Parameter [[nama]] harus string, dan fungsi mengembalikan string. Tipe ditulis setelah titik dua.','Kalau kamu memanggil [[sapa(5)]], kompilator langsung protes.'],['  return "Halo, " + nama + "!";','Menyusun kalimat.','Menggabungkan teks.','Hasil bertipe string sesuai janji.'],['}'],['console.log(sapa("dunia"));','Mencoba fungsinya.','Cetak hasil pemanggilan.','Uji hasil.']]],
 tour:['tur.ts',[['let umur: number = 5;','Menegaskan jenis nilai.','Variabel hanya boleh berisi angka.','Mencegah bug seperti mengisi teks ke angka.'],['let tags: string[] = ["a", "b"];','List juga punya tipe.','Array berisi string saja.','Error kalau kamu push angka.'],['interface Hewan { nama: string; umur?: number }','Mendefinisikan bentuk sebuah objek.','Interface: objek harus punya [[nama]]; [[umur]] boleh tidak ada (tanda tanya).','Kontrak yang bisa dicek.'],['const kucing: Hewan = { nama: "Mimi" };','Membuat objek sesuai kontrak.','Objek memenuhi interface Hewan.','Kalau lupa [[nama]], error.'],['type Id = string | number;','Nilai yang boleh dua jenis.','Union type: string atau number.','Fleksibel tapi tetap aman.'],['function kali<T>(x: T[]): T[] { return x; }','Fungsi yang bekerja untuk tipe apa saja.','Generic: [[T]] adalah tipe yang ditentukan saat dipanggil.','Kode dipakai ulang dengan aman.'],['enum Warna { Merah, Biru }','Pilihan tetap.','Enum: kumpulan nama konstanta.','Kode lebih mudah dibaca daripada angka 0 dan 1.']]],
 trap:['Tipe hanya ada saat menulis kode. Setelah jadi JavaScript semuanya hilang, jadi data dari luar (API) tetap harus dicek.','Jangan menyerah dan menulis [[any]] di mana-mana, itu mematikan manfaat TypeScript.'],
 cmp:[['Tipe','Dinamis','Statis (dicek saat kompilasi)'],['Berkas','[[.js]]','[[.ts]] lalu dikompilasi ke [[.js]]'],['Autocomplete','Terbatas','Sangat baik']],
 q1:['TypeScript pada akhirnya dijalankan sebagai...',['Kode mesin','JavaScript','Python','Bytecode Java'],1,'Browser dan Node.js hanya mengerti JavaScript, jadi TypeScript dikompilasi ke JavaScript.'],
 q2:['Pada [[let a: number]], bagian [[: number]] disebut...',['Komentar','Anotasi tipe','Perulangan','Fungsi'],1,'Itu anotasi tipe: aturan jenis nilai yang boleh disimpan.']}),
LX({id:'lx7',name:'Python',t:'Python',say:'Python itu bahasa yang <b>paling mirip bahasa manusia</b>. Favorit pemula dan para ahli data!',
 intro:'Python menekankan kode yang bersih dan mudah dibaca. Blok kode ditandai dengan indentasi (spasi), bukan kurung kurawal.',
 prof:[['Dibuat','1991, Guido van Rossum'],['Jenis','Ditafsirkan (bytecode lalu mesin virtual)'],['Tipe','Dinamis'],['Paradigma','Multi: OOP, fungsional, prosedural'],['Dipakai untuk','Data science, AI/ML, otomatisasi, backend (Django, Flask, FastAPI), pendidikan'],['Kelebihan','Sintaks bersih, pustaka sangat lengkap, komunitas besar'],['Kekurangan','Lebih lambat dari bahasa terkompilasi, kurang cocok untuk aplikasi HP'],['Siapa yang pakai','Google, Instagram, Netflix, NASA, hampir semua tim AI']],
 run:['terminal','python3 --version\npython3 halo.py\npython3          # masuk mode interaktif (REPL)\npip install requests   # memasang pustaka'],
 hello:['halo.py',[['print("Halo, dunia!")','Program butuh cara menampilkan sesuatu.','[[print]] adalah fungsi bawaan untuk mencetak ke layar.','Satu baris saja sudah jadi program. Tidak ada kerangka wajib.']]],
 tour:['tur.py',[['nama = "Pita"','Menyimpan teks.','Tanpa kata kunci; langsung isi variabel.','Tipe ditebak otomatis (dinamis).'],['umur = 5','Menyimpan angka.'],['if umur > 3:','Mengambil keputusan.','Kondisi diakhiri titik dua [[:]], isinya menjorok ke dalam.','Indentasi adalah bagian dari tata bahasa.'],['    print("besar")'],['for i in range(3):','Mengulang 3 kali.','[[range(3)]] menghasilkan 0, 1, 2.','Perulangan paling sering.'],['    print(i)'],['def kali2(x):','Membuat fungsi.','[[def]] = define.','Mengemas langkah.'],['    return x * 2'],['angka = [1, 2, 3]','List (daftar).','Kurung siku.','Menyimpan banyak nilai.'],['dobel = [x * 2 for x in angka]','Membuat list baru dari list lama.','List comprehension: ringkas dan khas Python.','Menggantikan loop panjang.'],['data = {"nama": "Pita", "umur": 5}','Pasangan kunci dan nilai.','Dictionary.','Mirip objek di JavaScript.'],['class Hewan:','Membuat blueprint.','[[class]] mendefinisikan kelas.','OOP.'],['    def __init__(self, nama):','Menyiapkan objek baru.','Konstruktor; [[self]] adalah objek itu sendiri.','Mengisi data awal.'],['        self.nama = nama'],['try:','Mencoba.','Mulai blok yang mungkin error.','Penanganan error.'],['    int("abc")'],['except ValueError:','Menangkap error tertentu.','Jalan kalau terjadi [[ValueError]].','Program tidak mati.'],['    print("bukan angka")']]],
 trap:['Indentasi harus konsisten (4 spasi). Campuran tab dan spasi menyebabkan [[IndentationError]].','Lupa titik dua di akhir [[if]], [[for]], [[def]].','Python 2 sudah mati; pakai Python 3.'],
 cmp:[['Blok kode','Kurung kurawal','Indentasi'],['Akhir baris','Titik koma (opsional)','Tidak perlu'],['Cetak','[[console.log(x)]]','[[print(x)]]'],['Kamus','[[{a: 1}]]','[[{"a": 1}]]'],['Benar/salah','[[true]] / [[false]]','[[True]] / [[False]]'],['Kecepatan','Cepat (JIT)','Lebih lambat']],
 q1:['Python menandai isi blok dengan...',['Kurung kurawal','Indentasi','Tag','Titik koma'],1,'Indentasi (spasi di awal baris) adalah bagian dari tata bahasa Python.'],
 q2:['Kode [[[x * 2 for x in angka]]] disebut...',['Fungsi rekursif','List comprehension','Dekorator','Kelas'],1,'Cara ringkas membuat list baru dari list lain.']}),
LX({id:'lx8',name:'Java',t:'Java',say:'Java itu bahasa <b>serius dan sabar</b>. Banyak aturannya, tapi hasilnya kokoh, dipakai bank dan Android lama.',
 intro:'Slogan Java: "write once, run anywhere". Kode dikompilasi menjadi bytecode, lalu JVM (Java Virtual Machine) menjalankannya di sistem operasi apa pun.',
 prof:[['Dibuat','1995, James Gosling, Sun Microsystems (kini Oracle)'],['Jenis','Dikompilasi ke bytecode, dijalankan JVM (JIT)'],['Tipe','Statis'],['Paradigma','Berorientasi objek (plus fungsional sejak Java 8)'],['Dipakai untuk','Sistem perbankan, backend besar (Spring), Android (sejak lama), Minecraft Java Edition'],['Kelebihan','Stabil, cepat, ekosistem dan lowongan kerja sangat banyak'],['Kekurangan','Kode panjang (verbose), pemula harus belajar kelas dulu'],['Siapa yang pakai','Bank, Amazon, Netflix, Tokopedia (sebagian sistem)']],
 run:['terminal','java --version\njavac Halo.java     # menghasilkan Halo.class\njava Halo           # menjalankan\njava Halo.java      # (Java 11+) langsung jalan tanpa langkah javac'],
 hello:['Halo.java',[['public class Halo {','Di Java semua kode harus berada di dalam kelas.','Membuat kelas bernama [[Halo]]. [[public]] berarti bisa diakses dari luar. Nama kelas harus sama dengan nama file.','Java adalah bahasa berorientasi objek, jadi wadah dasarnya selalu kelas.'],['    public static void main(String[] args) {','Java perlu tahu dari mana program mulai berjalan.','[[main]] adalah pintu masuk. [[public]]: bisa dipanggil JVM. [[static]]: bisa dijalankan tanpa membuat objek dulu. [[void]]: tidak mengembalikan nilai. [[String[] args]]: argumen dari terminal.','Setiap program Java dimulai dari method ini.'],['        System.out.println("Halo, dunia!");','Menampilkan teks.','[[System.out]] adalah aliran keluaran standar, [[println]] mencetak lalu pindah baris.','Output ke layar.'],['    }','Penutup method main.'],['}','Penutup kelas Halo.']]],
 tour:['Tur.java',[['int umur = 5;','Java wajib menyebut tipe.','[[int]] = bilangan bulat.','Kompilator bisa mengecek kesalahan tipe.'],['String nama = "Pita";','Teks.','[[String]] diawali huruf besar (ia sebuah kelas).','Menyimpan kata.'],['if (umur > 3) { System.out.println("besar"); }','Keputusan.','Kondisi dalam kurung, isi dalam kurung kurawal.','Percabangan.'],['for (int i = 0; i < 3; i++) { System.out.println(i); }','Pengulangan.','Gaya C: inisialisasi, kondisi, kenaikan.','Mengulang 3 kali.'],['static int kali2(int x) { return x * 2; }','Fungsi (disebut method).','Tipe kembalian [[int]], parameter bertipe.','Mengemas langkah.'],['int[] a = {1, 2, 3};','Array ukuran tetap.','Ukuran tidak bisa berubah.','Daftar sederhana.'],['ArrayList<String> l = new ArrayList<>();','List yang bisa tumbuh.','[[ArrayList]] dengan tipe isi di dalam [[<>]] (generic).','Dipakai sehari-hari.'],['HashMap<String,Integer> m = new HashMap<>();','Kamus.','Pasangan kunci dan nilai bertipe.','Mencari data cepat.'],['try { int x = 1 / 0; } catch (ArithmeticException e) { System.out.println("gagal"); }','Menangani error.','Pembagian dengan nol melempar exception yang ditangkap catch.','Program tidak crash.']]],
 trap:['Nama file harus sama dengan nama kelas publik, termasuk huruf besar-kecil.','Membandingkan String dengan [[==]] salah; pakai [[.equals()]].','Lupa titik koma di akhir pernyataan.'],
 cmp:[['Tipe','Dinamis','Statis, wajib ditulis'],['Titik masuk','Kode langsung jalan','Harus ada [[main]] dalam kelas'],['Jalan di','Browser/Node','JVM'],['Panjang kode','Ringkas','Lebih panjang']],
 q1:['Kata [[static]] pada [[main]] artinya...',['Tidak bisa diubah','Bisa dipanggil tanpa membuat objek kelasnya','Hanya untuk teks','Hanya untuk angka'],1,'JVM memanggil main tanpa membuat objek Halo, jadi main harus static.'],
 q2:['Apa tugas JVM?',['Menggambar halaman web','Menjalankan bytecode di sistem operasi apa pun','Menyimpan database','Mengompres gambar'],1,'JVM menerjemahkan bytecode ke mesin tempat ia berjalan.']}),
LX({id:'lx9',name:'C',t:'C',say:'C itu <b>kakek semua bahasa</b>. Dekat sekali dengan mesin, jadi kamu belajar komputer dari dalam!',
 intro:'C adalah bahasa kecil, cepat, dan dekat dengan perangkat keras. Banyak bahasa lain (C++, Java, C#, Go, JavaScript) meminjam sintaksnya.',

DEMOS.ixreq={t:'Simulasi request & response',h:'<div class="ctl"><label>Metode <select data-m><option>GET</option><option>POST</option><option>DELETE</option></select></label><label>Alamat <select data-u><option value="/">/ (beranda)</option><option value="/profil">/profil</option><option value="/rahasia">/rahasia</option><option value="/hilang">/halaman-ngawur</option><option value="/error">/bikin-server-error</option></select></label><button class="btn s p" data-go>Kirim ▶</button></div><pre class="codeout" data-q style="white-space:pre-wrap"></pre><pre class="codeout" data-r style="white-space:pre-wrap">Tekan Kirim untuk melihat jawaban server.</pre>',
i(b){
 const q=s=>b.querySelector(s);
 const RT={'/':[200,'OK','<h1>Selamat datang!</h1>'],'/profil':[200,'OK','{"nama":"Aisyah","streak":12}'],'/rahasia':[401,'Unauthorized','Kamu belum login.'],'/hilang':[404,'Not Found','Halaman tidak ada.'],'/error':[500,'Internal Server Error','Dapurnya kebakaran, coba lagi nanti.']};
 const f=()=>{const m=q('[data-m]').value,u=q('[data-u]').value;
  q('[data-q]').textContent='REQUEST (dari browser)\n'+m+' '+u+' HTTP/1.1\nHost: kebunmurojaah.app\nAccept: text/html';
  let r=RT[u];if(m==='DELETE'&&u==='/profil')r=[403,'Forbidden','Kamu tidak boleh menghapus profil orang.'];
  if(m==='POST'&&u==='/'||m==='POST'&&u==='/profil')r=[201,'Created','Data baru disimpan.'];
  q('[data-r]').textContent='RESPONSE (dari server)\nHTTP/1.1 '+r[0]+' '+r[1]+'\nContent-Type: text/plain\n\n'+r[2]};
 q('[data-go]').onclick=f;b.addEventListener('change',()=>{q('[data-r]').textContent='Tekan Kirim untuk melihat jawaban server.'})}};
DEMOS.ixurl={t:'Bedah alamat URL',h:'<div class="ctl"><label>Tempel URL <input type="text" data-i size="38" value="https://kebun.app:8080/belajar/html?bab=3&tema=pink#latihan" style="max-width:100%"></label></div><div class="scroll"><table class="t" data-o></table></div>',
i(b){
 const o=b.querySelector('[data-o]'),inp=b.querySelector('[data-i]');
 const D={'protocol':'Aturan bicara (http/https)','hostname':'Nama server / domain','port':'Pintu di server (default 80/443)','pathname':'Letak halaman di server','search':'Pertanyaan tambahan (query string)','hash':'Loncat ke bagian dalam halaman'};
 const f=()=>{try{const u=new URL(inp.value);o.innerHTML='<tr><th>Bagian</th><th>Nilai</th><th>Artinya</th></tr>'+Object.keys(D).map(k=>'<tr><td><code class="i">'+k+'</code></td><td>'+(String(u[k]||'(kosong)').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])))+'</td><td>'+D[k]+'</td></tr>').join('')}catch(e){o.innerHTML='<tr><td>URL belum valid. Awali dengan https://</td></tr>'}};
 inp.addEventListener('input',f);f()}};
DEMOS.ixstack={t:'Stack (tumpukan) vs Queue (antrean)',h:'<div class="ctl"><label>Isi <input type="text" data-v size="8" value="A"></label><button class="btn s p" data-a="push">push / enqueue</button><button class="btn s" data-a="pop">pop (stack: ambil atas)</button><button class="btn s" data-a="shift">dequeue (queue: ambil depan)</button><button class="btn s g" data-a="clr">kosongkan</button></div><div class="stage" data-st style="min-height:0"></div><pre class="codeout" data-o></pre>',
i(b){
 const L=['A','B','C'],st=b.querySelector('[data-st]'),o=b.querySelector('[data-o]');let last='';
 const f=()=>{st.innerHTML='<div class="row" style="gap:6px;flex-wrap:wrap">'+(L.length?L.map((x,i)=>'<span class="chip" style="'+(i===0?'border-style:dashed;':'')+'">'+x.replace(/[<>&]/g,'?')+'</span>').join(''):'<i>(kosong)</i>')+'</div>';
  o.textContent='array = ['+L.map(x=>JSON.stringify(x)).join(', ')+']\n'+last+'\nStack: masuk & keluar di UJUNG yang sama (LIFO: terakhir masuk, pertama keluar).\nQueue: masuk di belakang, keluar dari DEPAN (FIFO: pertama masuk, pertama keluar).'};
 b.addEventListener('click',e=>{const x=e.target.closest('[data-a]');if(!x)return;const a=x.dataset.a;
  if(a==='push'){const v=b.querySelector('[data-v]').value.trim()||'?';L.push(v);last='L.push("'+v+'")'}
  if(a==='pop'){last=L.length?'L.pop() -> "'+L.pop()+'"  (ambil dari ujung kanan)':'kosong, tidak ada yang di-pop'}
  if(a==='shift'){last=L.length?'L.shift() -> "'+L.shift()+'"  (ambil dari kiri / depan)':'kosong, tidak ada yang di-shift'}
  if(a==='clr'){L.length=0;last='L.length = 0'}f()});f()}};

  ['<link href="https://fonts.googleapis.com/css2?family=Mali…" rel="stylesheet">','Tema gemes butuh huruf yang bukan bawaan perangkat.','Mengambil file CSS font dari Google Fonts.','Tampilan huruf sama di semua perangkat.'],

{id:'bd3',t:'CSS: variabel, body, mode gelap',say:'Di sinilah 19 tema berasal dari: satu set variabel yang bisa ditukar-tukar.',blocks:[

  [':root{','Warna dipakai ratusan kali.','Rumah variabel, berlaku di seluruh halaman.','Ganti warna di satu tempat, semua berubah.'],

  ['body{','Ini kanvas seluruh halaman.'],

  ['  background-color:var(--page);','Latar harus punya warna.','Pakai variabel [[--page]].','Ikut berubah saat tema diganti.'],
  ['  background-image:radial-gradient(var(--dot) 2.5px, transparent 3px);','Latar polos membosankan.','Membuat bintik-bintik dengan gradien radial.','Tekstur polkadot tanpa file gambar sama sekali.'],
  ['  padding-left:max(16px, env(safe-area-inset-left,0px));','HP berponi/lengkung menutupi pinggir layar.','Ambil yang lebih besar: 16px atau area aman perangkat.','Konten tidak tertutup notch.'],
  ['}']]),
 Z_('Kenapa kode mode gelap cukup mengganti nilai variabel?',['Karena CSS otomatis tahu','Karena semua komponen memakai [[var(--…)]], jadi ikut berubah','Karena JavaScript yang mengganti','Karena dark mode tidak butuh warna'],1,'Komponen tidak menulis warna langsung; mereka mengambil dari variabel.'),
 D_('vars')]},
{id:'bd4',t:'HTML body: dua layar & bingkai',say:'Dua layar utama: login dan aplikasi. Hanya satu tampil dalam satu waktu. Rahasianya: atribut hidden.',blocks:[
 A_('Struktur body (disederhanakan)','html',[
  ['<svg style="display:none">…</svg>','Ikon dipakai berulang di banyak tempat.','Kumpulan [[<symbol>]] (ikon) yang tidak tampil, dipanggil dengan [[<use href="#i-star">]].','Ikon ditulis sekali, dipakai di mana saja.'],
  ['<div id="authScreen" hidden>','Pengguna harus login dulu (atau lanjut sebagai tamu).','Layar login, awalnya tersembunyi ([[hidden]]).','JavaScript yang memutuskan layar mana yang ditampilkan.'],
  ['  <div class="frame">','Dekorasi bingkai rumah-rumahan.','Pembungkus yang menampilkan bingkai dan atap bergaris ([[.awning]]).','Identitas visual Kebun Murojaah.'],
  ['<div id="app" hidden>','Layar utama aplikasi.','Dibuka setelah login berhasil.','Memisahkan dunia login dan dunia aplikasi.'],
  ['  <header class="top">','Kepala berisi status, koin, judul, tombol.','Header dengan pil status streak 🔥, koin 🪙, dan tombol tema.','Selalu terlihat, info penting di satu tempat.'],
  ['  <nav id="nav">','Menu samping/atas.','Berisi tombol dengan [[data-go="murojaah"]] dst.','JavaScript membaca [[data-go]] untuk berpindah halaman.'],
  ['  <main id="main">','Isi utama berubah-ubah.','Berisi banyak [[<section id="p-…">]], satu untuk tiap halaman.','Hanya satu section yang tampil, sisanya [[hidden]].']]),
 P_('Pola kuncinya: <b>satu file HTML, banyak "halaman" yang disembunyikan/ditampilkan</b>. Ini disebut <b>SPA</b> (Single Page Application). Tidak ada pemuatan ulang, jadi terasa seperti aplikasi.'),
 Z_('Cara Kebun Murojaah menampilkan "halaman" yang berbeda adalah...',['Membuka file HTML lain','Menyembunyikan semua section lalu menampilkan satu dengan [[hidden]]','Memuat ulang browser','Memakai iframe'],1,'Itulah yang dilakukan [[renderPage()]], kita bedah di bab Router.')]},
{id:'bd5',t:'JS dasar: js1.js (alat-alat kecil)',say:'File JavaScript pertama berisi alat dasar. Kecil-kecil tapi dipakai di mana-mana.',blocks:[
 A_('js1.js (asli)','js',[
  ['"use strict";','JavaScript lama membiarkan kesalahan kecil lolos diam-diam.','Mode ketat: salah tulis variabel jadi error, bukan lolos.','Bug ketahuan lebih cepat.'],
  ['const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];','[[document.querySelector]] terlalu panjang diketik ratusan kali.','Singkatan: [[$("#app")]] = satu elemen. [[$$(".card")]] = semua, sebagai array.','Kode lebih pendek dan mudah dibaca (mirip jQuery).'],
  ['const esc=s=>String(s).replace(/[&<>"\']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"})[c]);','Teks dari pengguna (misal nama) bisa berisi tag HTML jahat.','Mengganti karakter khusus agar dianggap teks biasa, bukan kode.','<b>Mencegah serangan XSS</b>. Dipakai setiap kali menampilkan data pengguna.'],
  ['const pad=n=>String(n).padStart(2,"0");','Tanggal 5 harus jadi "05".','Menambah angka nol di depan sampai 2 digit.','Format 2026-11-05 yang rapi dan bisa diurutkan.'],
  ['const dstr=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());','Perlu format tanggal tunggal yang konsisten.','Mengubah objek Date jadi teks "YYYY-MM-DD". [[getMonth()]] mulai dari 0, jadi +1.','Tanggal disimpan sebagai teks, mudah dibandingkan dan disimpan.'],
  ['const today=()=>dstr(new Date());','"Hari ini" sering dibutuhkan.','Fungsi tanpa input yang mengembalikan tanggal hari ini.','Streak, jurnal, kuis, semua memakainya.'],
  ['const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return dstr(d)};','Mau mundur sehari, tapi 1 Maret mundur jadi 28/29 Februari.','Menambah n hari (boleh negatif); objek Date yang mengurus pergantian bulan.','Inti perhitungan streak. Jangan hitung manual!'],
  ['const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));','Angka harus tetap di dalam rentang.','Memaksa n berada di antara a dan b.','Misal target menit tidak boleh negatif.']]),
 D_('dom'),
 Z_('Kenapa [[esc()]] penting?',['Biar teks tebal','Mencegah teks pengguna dianggap kode HTML (XSS)','Mempercepat web','Mengubah bahasa'],1,'Tanpa [[esc]], nama seperti [[<img onerror=…>]] bisa menjalankan kode jahat.')]},
{id:'bd6',t:'State, simpan data & streak',say:'S adalah "otak ingatan" web ini. Satu objek besar yang menyimpan semuanya.',blocks:[
 P_('Semua data pengguna (sesi, koin, target, tema) hidup di satu objek bernama [[S]]. Setiap kali berubah, panggil [[save()]] supaya masuk ke [[localStorage]] dan (jika online) ke Firebase.'),
 A_('streakInfo() asli, js1.js','js',[
  ['function streakInfo(){','Banyak halaman perlu tahu streak.','Fungsi tunggal yang menghitung semua info streak.','Satu sumber kebenaran: tampilan di mana pun pasti sama.'],
  ['  const m=dayMap(),t=today();','Perlu tahu hari mana saja yang ada sesinya.','[[dayMap()]] membuat objek {"2026-11-05":true,...}. [[t]] = hari ini.','Pengecekan "hari ini ada?" jadi instan: [[m[t]]].'],
  ['  let cur=0,d=m[t]?t:addDays(t,-1);','Jika hari ini belum murojaah, streak kemarin belum putus.','[[cur]] = hitungan. Mulai dari hari ini kalau ada, kalau tidak mulai dari kemarin.','Adil: pengguna masih punya sisa hari ini untuk melanjutkan.'],
  ['  while(m[d]){cur++;d=addDays(d,-1)}','Hitung berapa hari berturut-turut ke belakang.','Selama hari [[d]] ada di catatan: tambah 1 lalu mundur sehari.','Berhenti otomatis saat ketemu hari kosong.'],
  ['  let best=0,run=0,prev=null;','Rekor terbaik juga mau ditampilkan.','Siapkan penghitung rekor.'],
  ['  for(const x of Object.keys(m).sort()){run=(prev&&addDays(prev,1)===x)?run+1:1;best=Math.max(best,run);prev=x}','Cari deretan terpanjang di seluruh riwayat.','Urutkan hari, jika hari ini = hari sebelumnya + 1 maka deret lanjut, kalau tidak mulai dari 1.','Nilai [[best]] adalah deretan terpanjang.'],
  ['  return {cur,best,doneToday:!!m[t],map:m};','Pemanggil butuh beberapa nilai sekaligus.','Mengembalikan objek berisi streak, rekor, status hari ini.','Dipakai kartu api 🔥 di beranda.'],
  ['}']]),
 D_('streak'),
 D_('store'),
 Z_('Jika hari ini belum murojaah tapi kemarin sudah, streak...',['Langsung 0','Masih terhitung (mulai dari kemarin)','Error','Reset ke 1'],1,'Itulah makna [[m[t]?t:addDays(t,-1)]]: streak belum putus sampai hari berganti.')]},
{id:'bd7',t:'Router & event delegation',say:'Bagaimana tombol menu bisa berpindah halaman? Dua jurus: router dan delegasi event.',blocks:[
 A_('js3.js (asli, dipotong)','js',[
  ['const PAGES=["beranda","murojaah","tilawah","sunnah","games","juz","tajwid","tantangan","karakter","kalender","akun"];','Perlu daftar halaman sah.','Array nama halaman. Tiap nama punya section [[#p-nama]].','Mencegah pindah ke halaman yang tidak ada.'],
  ['const P={beranda:pBeranda,murojaah:pMurojaah,juz:pJuz,…};','Setiap halaman perlu cara menggambar dirinya.','Peta: nama → fungsi yang mengembalikan HTML halaman itu.','Menambah halaman = tambah satu fungsi dan satu nama.'],
  ['let cur="beranda";','Perlu ingat sedang di halaman mana.','Variabel halaman aktif.'],
  ['function renderPage(){','Layar harus mengikuti nilai [[cur]].','Menggambar ulang halaman aktif.'],
  ['  PAGES.forEach(n=>{$("#p-"+n).hidden=n!==cur});','Hanya satu halaman boleh terlihat.','Untuk tiap halaman: sembunyikan kecuali yang aktif.','Inilah yang membuat SPA terasa seperti pindah halaman.'],
  ['  $("#p-"+cur).innerHTML=P[cur]();','Isi halaman dibuat dari data terbaru.','Panggil fungsi halaman, hasil HTML dimasukkan ke section.','Isi selalu segar sesuai state [[S]].'],
  ['}'],
  ['function go(n){if(!PAGES.includes(n))n="beranda";cur=n;history.replaceState(null,"","#"+n);renderPage()}','Tombol menu butuh satu pintu untuk pindah.','Validasi nama, ubah [[cur]], tulis #hash di alamat, gambar ulang.','Tombol Back/refresh tetap tahu posisi halaman.'],
  ['document.addEventListener("click",e=>{','Ada ratusan tombol, dan banyak dibuat ulang oleh JavaScript.','Satu "telinga" untuk seluruh dokumen.','Tombol baru otomatis berfungsi. Tidak perlu daftar ulang.'],
  ['  const go_=e.target.closest("[data-go]");if(go_){go(go_.dataset.go);return}','Klik bisa mengenai ikon di dalam tombol, bukan tombolnya.','[[closest]] naik ke atas sampai ketemu elemen ber-[[data-go]].','Pindah halaman sesuai [[data-go]].'],
  ['  const a=e.target.closest("[data-act]");if(a&&ACT[a.dataset.act])ACT[a.dataset.act](a,e);','Aksi lain: hapus, simpan, mulai timer.','Mencari [[data-act]] dan menjalankan fungsi di peta [[ACT]].','Pola "satu pintu": tambah fitur = tambah satu entri ACT.'],
  ['});']]),
 D_('router'),
 D_('deleg'),
 Z_('Keuntungan event delegation (satu listener di document)?',['Kode lebih lambat','Tombol yang dibuat belakangan tetap berfungsi','Tidak butuh JavaScript','Memakai lebih banyak memori'],1,'Listener ada di induk, jadi elemen baru otomatis tercakup.')]},
{id:'bd8',t:'Timer & koin',say:'Timer murojaah dan sistem koin. Ada trik kecil supaya timer tidak bohong.',blocks:[
 A_('js2.js (tick) & js8.js (earn), asli','js',[
  ['function tick(){','Timer harus memperbarui layar berkala.','Dipanggil berulang selama timer berjalan.'],
  ['  if(!T.running) return;','Jika sudah dijeda, jangan lanjut.','Penjaga: keluar kalau tidak berjalan.','Mencegah timer "hantu".'],
  ['  updateTimerFace();','Tampilkan waktu.','Menulis menit:detik ke layar.'],
  ['  if(T.mode==="down"&&elapsed()>=T.mins*60000){…chime();saveSession(true);return}','Mode hitung mundur harus berhenti sendiri.','Jika waktu habis: bunyi lonceng dan simpan sesi.','Murojaah tercatat otomatis.'],
  ['  T.raf=setTimeout(tick,250);','Mau diulang tiap 0,25 detik.','Menjadwalkan [[tick]] lagi.','Cukup halus tanpa membebani baterai.'],
  ['function earn(n,why,capped,quiet){','Koin diberikan dari banyak fitur.','Satu fungsi pusat penambah koin.','Aturan koin ada di satu tempat.'],
  ['  if(capped){ … n=Math.min(n,Math.max(0,INSTANT_CAP-S.ei.n));S.ei.n+=n }','Mencegah farming koin dengan klik berulang.','Batasi koin per hari. Hari baru → hitungan reset.','Ekonomi koin adil.'],
  ['  S.coins=(S.coins||0)+n;','Tambahkan.','[[(S.coins||0)]] = anggap 0 kalau belum ada.','Aman untuk pengguna lama.'],
  ['  save();if(!quiet)sfx("coin");coinFly(n);return n;','Data harus tersimpan, pengguna perlu umpan balik.','Simpan, bunyi, animasi koin terbang, kembalikan jumlah sebenarnya.','Terasa memuaskan seperti game.']]),
 D_('timer'),
 D_('earn'),
 Z_('Kenapa waktu dihitung dari [[Date.now()]] bukan menambah 1 tiap tick?',['Biar lucu','Karena tab di background bisa menunda tick, sedangkan jam sistem tetap akurat','Karena Date lebih mudah','Tidak ada bedanya'],1,'Browser menahan timer saat tab tidak aktif. Selisih jam sistem tetap benar.')]},
{id:'bd9',t:'Login & kata sandi (hash)',say:'Kata sandimu tidak pernah disimpan apa adanya. Hanya "sidik jari"-nya. Ini bagian penting keamanan.',blocks:[
 A_('js5.js hashPw (asli, dipotong)','js',[
  ['async function hashPw(salt,pw){','Hasil perhitungan butuh waktu, jadi fungsi ini asinkron.','Menerima salt dan sandi, mengembalikan hash.','Disimpan hash-nya saja, bukan sandi.'],
  ['  if(window.crypto&&crypto.subtle){','Fitur kripto hanya ada di sambungan aman (https).','Cek apakah browser menyediakannya.','Kalau tidak ada, pakai cadangan.'],
  ['    const key=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);','Sandi harus diubah ke byte dan dibungkus sebagai "kunci".','Mengimpor sandi untuk dipakai algoritma PBKDF2.','Langkah wajib API crypto.'],
  ['    const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:…,iterations:150000,hash:"SHA-256"},key,256);','Hash cepat itu berbahaya: penebak bisa mencoba miliaran sandi per detik.','Mengacak sandi + salt 150.000 kali dengan SHA-256.','Sengaja lambat (~0,1 detik). Penebak jadi sangat lambat. [[salt]] membuat sandi sama menghasilkan hash beda per pengguna.'],
  ['    return "p1:"+hex(bits);','Perlu bentuk teks untuk disimpan.','Ubah byte ke heksadesimal, beri awalan versi "p1:".','Awalan versi memudahkan upgrade algoritma nanti.'],
  ['  // cadangan bila crypto tidak tersedia','Web bisa dibuka lewat file lokal tanpa https.','Hash sederhana sebagai jaring pengaman (lebih lemah).','Aplikasi tetap jalan di mana saja.']]),
 D_('hash'),
 N_('warn','Batas keamanan','Login lokal hanya melindungi dari orang iseng di perangkat yang sama. Di mode Firebase, kata sandi diurus Google, jauh lebih kuat.'.split('|')),
 Z_('Kenapa sandi tidak disimpan apa adanya?',['Biar hemat tempat','Kalau data bocor, sandi asli tidak ikut bocor','Karena JavaScript tidak bisa','Biar lebih cepat'],1,'Hash adalah jalan satu arah: dari hash, sandi asli tidak bisa dikembalikan.')]},
{id:'bd10',t:'Suara dengan WebAudio',say:'Semua bunyi di Kebun Murojaah dibuat dari rumus, tanpa satu file mp3 pun. Keren kan?',blocks:[
 A_('js6.js (asli, dipotong)','js',[
  ['const mtof=m=>440*Math.pow(2,(m-69)/12);','Not musik punya nomor (MIDI), speaker butuh frekuensi Hz.','Rumus: nada 69 = A4 = 440 Hz. Naik 12 nomor = frekuensi 2x (satu oktaf).','Cukup tulis nomor nada, kode mengubahnya ke frekuensi.'],
  ['function note(m,t,dur,o){','Suara butuh nada, waktu mulai, durasi.','Memainkan satu nada.'],
  ['  const c=SND.ctx,f=mtof(m),…','Semua suara lewat satu [[AudioContext]].','Ambil konteks audio dan frekuensi.','Satu mixer untuk semua suara.'],
  ['  const env=c.createGain();env.gain.setValueAtTime(0.0001,t);','Nada yang mulai dan berhenti mendadak berbunyi "klik".','[[Gain]] = pengatur volume. Awali nyaris sunyi.','Cegah bunyi kasar.'],
  ['  env.gain.exponentialRampToValueAtTime(g,t+(o.a||0.006));','Naik halus ke volume penuh.','Menaikkan volume dalam 6 milidetik.','Bunyi "attack" yang bersih.'],
  ['  env.gain.exponentialRampToValueAtTime(0.0001,t+dur);','Nada harus memudar seperti denting asli.','Turun halus sampai hampir hening.','Terdengar natural seperti lonceng.'],
  ['  const parts=o.soft?[[1,1]]:[[1,1],[2,0.28],[4.05,0.06]];','Satu gelombang sinus terdengar datar.','Tambah "harmoni" di 2x dan ~4x frekuensi dengan volume kecil.','Warna suara jadi seperti lonceng kecil.'],
  ['  parts.forEach(p=>{const os=c.createOscillator(),…os.start(t);os.stop(t+dur+0.05)});','Tiap lapisan perlu pembangkit gelombang.','[[Oscillator]] membuat gelombang pada frekuensi tertentu, lalu dihentikan setelah selesai.','Tidak membocorkan memori.']]),
 D_('note'),
 P_('Catatan: browser baru mengizinkan suara <b>setelah pengguna menyentuh layar</b>. Itu sebabnya audio dibuat saat pertama ada tap.'),
 Z_('Kenapa volume dinaikkan dan diturunkan perlahan?',['Biar boros baterai','Menghindari bunyi "klik" dan membuat denting terasa natural','Aturan browser','Biar keras'],1,'Perubahan volume mendadak menghasilkan letupan; ramp membuatnya halus.')]},
{id:'bd11',t:'Tema (skin) & mode gelap',say:'19 tema, tapi kodenya sangat pendek. Itulah kekuatan variabel CSS.',blocks:[
 A_('js19.js skinApply (asli)','js',[
  ['function skinApply(id){','Tema bisa diganti kapan saja.','Menerapkan tema bernama [[id]].'],
  ['  const r=document.documentElement;','Elemen [[<html>]] adalah akar semua CSS.','Simpan referensinya.'],
  ['  if(id&&id!=="klasik"&&skinOK(id))r.setAttribute("data-skin",id);','Tema asli tidak perlu atribut.','Pasang [[data-skin="sakura"]] bila valid.','CSS [[[data-skin="sakura"]{…}]] aktif, variabelnya ditimpa.'],
  ['  else r.removeAttribute("data-skin");','Kembali ke tema dasar.','Hapus atribut.','Variabel kembali ke nilai awal [[:root]].'],
  ['}'],
  ['try{const k=localStorage.getItem(SKIN_KEY);if(k&&skinOK(k))skinApply(k)}catch(e){}','Layar login juga harus bertema, padahal data akun belum dimuat.','Baca tema terakhir langsung dari localStorage saat web dibuka.','Tidak ada kilatan warna salah saat memuat.']]),
 D_('skin'),
 Z_('Apa yang berubah ketika [[data-skin="hutan"]] dipasang pada [[<html>]]?',['HTML diganti total','Variabel CSS ditimpa dengan nilai tema hutan','Halaman dimuat ulang','Font diunduh ulang'],1,'Selector [[[data-skin=hutan]]] menimpa nilai variabel, semua komponen ikut.')]},
{id:'bd12',t:'Cari ayat, admin & Firebase',say:'Bab terakhir! Tiga fitur besar, dan semuanya memakai pola yang sudah kamu pelajari.',blocks:[

BOOK.bedah.ch.push({id:'bs1',t:'Timer murojaah',say:'Timer itu kelihatan sederhana, tapi ada trik penting biar waktunya tidak ngawur. Ayo kita intip!',blocks:[
 P_('Halaman <b>Murojaah</b> punya timer dengan dua mode: <b>hitung mundur</b> (misal 15 menit) dan <b>hitung maju</b> (stopwatch). Semua keadaannya disimpan di satu objek kecil bernama [[T]]. Alurnya:'),
 C_('alur timer','txt','Mulai  -> T.t0 = performance.now(), T.running = true, tick()\ntick() -> updateTimerFace() lalu jadwalkan tick lagi 250 ms\nJeda   -> T.acc += performance.now() - T.t0 ; T.running = false\nSimpan -> saveSession() : sesi masuk S.sessions + earn(10) koin'),
 A_('js2.js (asli)','js',[
  ['const T={mode:"down",mins:15,running:false,t0:0,acc:0,j:30,part:"all",ayat:null,raf:null};','Timer butuh banyak data yang saling terkait.','Satu objek: mode (down/up), menit target, sedang jalan atau tidak, [[t0]] (kapan mulai), [[acc]] (waktu yang sudah terkumpul), juz dan bagian yang diulang.','Kalau datanya satu tempat, semua fungsi timer cukup membaca [[T]].'],
  ['const elapsed=()=>T.acc+(T.running?performance.now()-T.t0:0);','Berapa lama sudah berjalan? Jawabannya harus benar walau layar dikunci atau tab disembunyikan.','Waktu terkumpul ([[acc]]) ditambah selisih jam sekarang dengan jam mulai, hanya jika sedang berjalan.','Waktu dihitung dari <b>jam sistem</b>, bukan dari jumlah tick. Itu kuncinya.'],
  ['const fmtT=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return pad(Math.floor(s/60))+":"+pad(s%60)};','Layar butuh tulisan 05:07, bukan angka milidetik.','Mundur: dibulatkan ke atas ([[ceil]]) supaya tidak tampil 00:00 padahal masih ada 0,4 detik. Menit dan detik diberi nol di depan oleh [[pad]].','Tampilan jam yang rapi.'],
  ['const fmtUp=ms=>{const s=Math.floor(ms/1000);return pad(Math.floor(s/60))+":"+pad(s%60)};','Maju beda dengan mundur.','Maju dibulatkan ke bawah ([[floor]]): detik baru naik setelah benar-benar lewat.','Stopwatch terasa jujur.'],
  ['function updateTimerFace(){','Tulisan di layar harus ikut berubah.','Memperbarui angka di [[#tFace]] tanpa menggambar ulang seluruh halaman.','Gambar ulang halaman penuh tiap 250 ms boros dan bikin tombol "berkedip".'],
  ['  document.title=T.running?(el.textContent+" · Kebun Murojaah"):"Kebun Murojaah";','Pengguna sering pindah tab sambil membaca.','Menaruh sisa waktu di judul tab browser.','Lihat sisa waktu tanpa pindah tab.'],
  ['function tick(){','Layar perlu diperbarui berkala.','Satu putaran pembaruan, lalu menjadwalkan dirinya lagi.'],
  ['  if(!T.running) return;','Kalau sudah dijeda, jangan lanjut.','Penjaga di awal ("guard clause").','Tidak ada timer hantu.'],
  ['  if(T.mode==="down"&&elapsed()>=T.mins*60000){T.acc=T.mins*60000;T.running=false;chime();saveSession(true);return}','Mode mundur harus berhenti sendiri.','Saat waktu habis: kunci waktu pas di target, bunyikan lonceng, simpan sesi otomatis.','Pengguna tak perlu menekan apa pun, sesi tercatat.'],
  ['  T.raf=setTimeout(tick,250);','Mau diulang terus.','Menjadwalkan [[tick]] lagi 250 ms kemudian.','Cukup halus, hemat baterai.']]),
 H_('Tombol Mulai/Jeda dan penyimpanan sesi'),
 A_('js3.js (ACT.tstart) dan js2.js (saveSession), asli','js',[
  ['if(T.running){T.acc+=performance.now()-T.t0;T.running=false;stopTimer()}','Saat Jeda, waktu yang sudah lewat harus "diamankan".','Tambahkan selisih ke [[acc]], hentikan.','Ketika lanjut, hitungan meneruskan, bukan mulai dari nol.'],
  ['else{if(T.mode==="down"&&T.acc>=T.mins*60000)T.acc=0;T.t0=performance.now();T.running=true;tick()}','Mulai atau Lanjut.','Jika mundur dan sudah habis, ulang dari nol. Catat [[t0]] baru, jalankan.','[[t0]] selalu "kapan terakhir mulai".'],
  ['function saveSession(auto){','Sesi harus dicatat ke riwayat.','[[auto]] = true jika dipanggil karena waktu habis.'],
  ['  if(sec<30){toast("Terlalu singkat. Murojaah minimal 30 detik ya.");return}','Mencegah catatan palsu karena salah pencet.','Tolak sesi di bawah 30 detik.','Data riwayat bersih.'],
  ['  S.sessions.push({id:uid(),d:today(),min,ayat,juz:T.j,s:g?g.s:null,ts:new Date().toISOString()});','Inilah "rekaman" sesi.','Menambah objek ke array [[S.sessions]]: id, tanggal, menit, ayat, juz, surah, cap waktu.','Streak, kalender, grafik, semuanya dihitung dari array ini.'],
  ['  const gain=earn(10,"Sesi murojaah",true);','Murojaah layak dihargai.','Memberi 10 koin, dengan batas harian (kita bedah di bab Koin).'],
  ['  const si=streakInfo();','Perlu tahu apakah streak baru naik.','Hitung ulang streak setelah sesi masuk.','Bunyi dan pesan beda untuk streak baru.'],
  ['  renderAll();','Header, sidebar, dan halaman harus segar.','Menggambar ulang semuanya dari [[S]].','Pola dasar: ubah data, lalu render ulang.']]),
 D_('timer'),
 N_('warn','Kesalahan umum',['<b>Menambah 1 per tick</b>: [[detik++]] tiap 1000 ms terlihat benar, tapi browser menunda timer di tab yang tidak aktif, jadi waktunya tertinggal. Selalu hitung dari jam sistem.','Lupa menyimpan [[acc]] saat Jeda, jadi waktu hilang saat dilanjutkan.']),
 H_('Versi mini: format waktu'),
 P_('Tulis fungsi [[fmt(ms)]] yang mengubah milidetik menjadi "mm:ss" (mode maju, dibulatkan ke bawah).'),
 G_({js:1,code:'const pad = n => String(n).padStart(2, "0");\n\nfunction fmt(ms) {\n  // tulis di sini\n}\n\nconsole.log(fmt(125000));\nconsole.log(fmt(5000));\n',goal:'[[fmt(125000)]] harus mencetak [[02:05]] dan [[fmt(5000)]] mencetak [[00:05]].',check:(d,l)=>l[0]==='02:05'&&l[1]==='00:05',sol:'const pad = n => String(n).padStart(2, "0");\nfunction fmt(ms) {\n  const s = Math.floor(ms / 1000);\n  return pad(Math.floor(s / 60)) + ":" + pad(s % 60);\n}\nconsole.log(fmt(125000));\nconsole.log(fmt(5000));\n'}),
 Z_('Kenapa [[elapsed()]] memakai selisih jam, bukan menghitung tick?',['Supaya kode lebih pendek','Karena browser bisa menunda tick di tab tidak aktif, sedangkan jam sistem tetap benar','Karena tick tidak ada di JavaScript','Supaya hemat memori'],1,'Timer di tab yang disembunyikan diperlambat browser. Selisih [[performance.now()]] tetap akurat.')
]});

BOOK.bedah.ch.push({id:'bs2',t:'Koin & ekonomi',say:'Koin itu semangat kecil yang dikumpulkan. Tapi hati-hati: kalau tidak dibatasi, bisa "dicurangi" lho!',blocks:[
 P_('Koin dikelola oleh satu fungsi pusat bernama [[earn()]]. Semua fitur (timer, tilawah, sunnah, kuis, tantangan) lewat pintu yang sama, jadi aturannya mudah diubah.'),
 C_('alur koin','txt','fitur apa pun -> earn(n, alasan, capped?, quiet?)\n   ├─ capped? potong sesuai sisa batas harian (INSTANT_CAP = 120)\n   ├─ S.coins += n\n   ├─ S.coinLog.unshift({d,n,why})  (maks 30 catatan)\n   └─ save(); bunyi "coin"; animasi coinFly(n)'),
 A_('js8.js (asli)','js',[
  ['const INSTANT_CAP=120;','Tanpa batas, orang bisa menekan tombol berkali-kali demi koin.','Konstanta batas koin "instan" per hari.','Konstanta bernama jelas lebih mudah diubah daripada angka 120 yang tersebar.'],
  ['function earn(n,why,capped,quiet){','Semua pemberian koin lewat satu pintu.','[[n]] jumlah, [[why]] alasan, [[capped]] apakah kena batas, [[quiet]] tanpa bunyi.'],
  ['  S.ei=S.ei||{d:"",n:0};','Pengguna lama belum punya catatan batas.','Siapkan objek {tanggal, jumlah terpakai} kalau belum ada.','Mencegah error pada data lama (pola "migrasi malas").'],
  ['    const t=today();if(S.ei.d!==t)S.ei={d:t,n:0};','Batas harus direset tiap hari.','Kalau tanggal catatan beda dari hari ini, mulai hitungan baru.','Batas "per hari" tanpa timer khusus.'],
  ['    n=Math.min(n,Math.max(0,INSTANT_CAP-S.ei.n));S.ei.n+=n;','Jangan melewati batas.','Ambil yang lebih kecil antara permintaan dan sisa jatah (minimal 0), lalu catat sebagai terpakai.','Misal sisa 20, minta 50: hanya 20 masuk.'],
  ['  if(!(n>0))return 0;','Kalau jatah habis, tidak ada yang diberikan.','Keluar dan mengembalikan 0. Perhatikan [[!(n>0)]] juga menangkap NaN.','Pemanggil tahu tidak ada koin yang masuk.'],
  ['  S.coins=(S.coins||0)+n;S.coinLog=S.coinLog||[];','Data lama mungkin belum punya koin.','Tambah koin, siapkan log.'],
  ['  S.coinLog.unshift({d:today(),n,why});S.coinLog.length=Math.min(S.coinLog.length,30);','Pengguna ingin tahu dari mana koinnya.','Tambah di depan, potong jadi maksimal 30 catatan.','Riwayat tidak membengkak.'],
  ['  save();if(!quiet)sfx("coin");coinFly(n);return n;','Data harus tersimpan dan terasa memuaskan.','Simpan, bunyi, animasi, lalu kembalikan jumlah koin sebenarnya.','Pemanggil memakainya untuk pesan "(+10 koin)".']]),
 H_('Animasi koin terbang'),
 A_('js8.js coinFly (asli)','js',[
  ['    if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;','Sebagian orang pusing melihat animasi.','Cek pengaturan sistem "kurangi gerakan"; jika aktif, tidak ada animasi.','Aksesibilitas yang sering dilupakan.'],
  ['    const p=$("#coinPill");if(!p||$("#app").hidden)return;const r=p.getBoundingClientRect();','Animasi harus muncul tepat di dekat pil koin.','Ambil posisi pil di layar dengan [[getBoundingClientRect()]].','Elemen animasi diletakkan pas di bawahnya.'],
  ['    const s=document.createElement("span");s.className="coinfly";s.textContent="+"+n;','Elemen sementara untuk animasi.','Buat [[span]] baru berisi "+10" dengan class [[coinfly]] (animasinya ada di CSS).'],
  ['    document.body.appendChild(s);setTimeout(()=>s.remove(),1100);','Elemen sementara harus dibersihkan.','Tempel ke body, hapus setelah 1,1 detik.','Tidak menumpuk sampah di DOM.']]),
 H_('Misi & klaim hadiah'),
 P_('Selain koin kecil, ada misi harian/pekan/sekali seumur hidup yang dihitung oleh [[chList()]]. Tiap misi adalah objek: [[{id, n, desc, reward, cur, goal, ok, claimed, key}]]. Kuncinya ada di [[key]]: untuk misi harian berbentuk <b>id@tanggal</b> (misal [[d1@2026-11-05]]), sehingga klaim besok dianggap misi baru.'),
 A_('js8.js chList (asli, dipotong)','js',[
  ['function chList(){','Daftar misi dihitung ulang dari data, bukan disimpan.','Mengembalikan array misi beserta progres terkini.','Progres selalu cocok dengan data terbaru, tidak bisa "basi".'],
  ['  const L=[],add=o=>{o.claimed=!!cl[o.key];L.push(o)};','Tiap misi perlu tahu sudah diklaim atau belum.','[[add]] menandai [[claimed]] dengan melihat [[S.claimed]], lalu memasukkan ke array.'],
  ['  add({id:"d1",grp:"day",n:"Capai target murojaah",…,reward:150,cur:Math.min(td.min,g.minutes),goal:g.minutes,unit:"mnt",key:"d1@"+t,ok:mt});','Satu contoh misi harian.','[[cur]] dibatasi [[Math.min]] supaya bar tidak lewat 100%. [[ok]] = syarat terpenuhi.','Kunci berisi tanggal, jadi klaim hari ini tidak mengunci besok.'],
  ['  [[3,1000],[7,3000],[14,7000],[30,20000]].forEach(([n,r])=>add({id:"s"+n,grp:"streak",…}))','Banyak misi serupa jangan ditulis berulang.','Satu baris membuat empat misi streak dari array pasangan [hari, hadiah].','Prinsip DRY: data di array, logika di satu tempat.']]),
 N_('tip','Pola penting',['Jangan menyimpan "progres misi" sebagai data. Simpan hanya <b>fakta</b> (sesi, centang) dan <b>klaim</b>. Progres dihitung ulang tiap render, jadi tidak mungkin tidak sinkron.']),
 D_('earn'),
 H_('Versi mini: batas harian'),
 G_({js:1,code:'const CAP = 120;\nlet coins = 0;\nlet used = 0;\n\nfunction earn(n) {\n  // batasi dengan sisa jatah (CAP - used), tambahkan ke coins dan used\n  // kembalikan jumlah koin yang benar-benar masuk\n}\n\nconsole.log(earn(100));\nconsole.log(earn(100));\nconsole.log(coins);\n',goal:'cetakan harus [[100]], [[20]], lalu [[120]].',check:(d,l)=>l[0]==='100'&&l[1]==='20'&&l[2]==='120',sol:'const CAP = 120;\nlet coins = 0;\nlet used = 0;\nfunction earn(n) {\n  n = Math.min(n, Math.max(0, CAP - used));\n  used += n;\n  coins += n;\n  return n;\n}\nconsole.log(earn(100));\nconsole.log(earn(100));\nconsole.log(coins);\n'}),
 Z_('Kenapa kunci misi harian berbentuk [[d1@2026-11-05]]?',['Supaya lebih panjang','Supaya klaim hari ini tidak menghalangi klaim besok','Karena JSON mewajibkan','Supaya terenkripsi'],1,'Tanggal di dalam kunci membuat setiap hari punya "lembar klaim" sendiri.')
]});

BOOK.bedah.ch.push({id:'bs3',t:'Login & akun lokal',say:'Walau cuma di browser, login-nya dibuat serius lho: ada salt, hash, dan pembatas percobaan.',blocks:[
 P_('Akun lokal disimpan di [[localStorage]] dengan kunci [[kebun-murojaah-accounts]]. Data tiap akun dipisah: [[kebun-murojaah-u-NAMAUSER]]. Jadi dua orang yang berbagi HP tidak saling melihat streak.'),
 C_('struktur ACC','txt','ACC = { users: { aisyah: {name, salt, hash, created} }, session: "aisyah" | null, last: "aisyah" }\nkunci data akun : "kebun-murojaah-u-aisyah"  -> objek S milik aisyah\nGUEST = "__tamu__"  -> mode tamu (data contoh)'),
 A_('js5.js (asli)','js',[
  ['const AK="kebun-murojaah-accounts", GUEST="__tamu__";','Nama kunci penyimpanan dan nama pengguna khusus perlu konstanta.','[[GUEST]] sengaja memakai garis bawah ganda agar tidak bisa didaftar orang (aturan username hanya huruf kecil/angka/titik/strip/garis bawah 3-20 karakter).'],
  ['let ACC={users:{},session:null,last:""}, curUser=null, authMode="login", authMem=false, fails=0, lockUntil=0, delAsk=false;','Banyak keadaan terkait login.','[[fails]] dan [[lockUntil]] untuk pembatas percobaan; [[authMem]] penanda bila penyimpanan diblokir browser.'],
  ['const userKey=u=>"kebun-murojaah-u-"+u;','Data tiap akun harus terpisah.','Membuat nama kunci unik per username.','Isolasi data antar pengguna.'],
  ['const validUser=u=>/^[a-z0-9._-]{3,20}$/.test(u);','Username sembarang bisa merusak kunci atau tampilan.','Regex: hanya huruf kecil, angka, titik, strip, garis bawah; panjang 3-20.','Validasi di pintu masuk.'],
  ['function randSalt(){const a=new Uint8Array(16);try{crypto.getRandomValues(a)}catch(e){…}return hex(a)}','Dua orang dengan sandi sama tidak boleh punya hash sama.','Membuat 16 byte acak lalu mengubahnya ke heksadesimal.','Salt acak per akun menggagalkan serangan tabel hash siap pakai.']]),
 H_('Alur Daftar dan Masuk'),
 A_('js5.js (submit form, asli, dipotong)','js',[

{id:'bz1',t:'Bangun sendiri #1: kerangka Kebun Mini',say:'Cukup membaca! Sekarang kita <b>bangun</b> versi mini Kebun Murojaah, selangkah demi selangkah. Mulai dari kerangka dan dandanan.',blocks:[

  ['<style>'],

{id:'bz2',t:'Bangun sendiri #2: state, save & streak',say:'Sekarang <b>otaknya</b>: ingat hari mana saja yang sudah murojaah, lalu hitung streak. Persis ide asli [[streakInfo()]].',blocks:[
 P_('Rencana: simpan objek [[S]] berisi {hari: true}. Setiap klik "Tandai" mencatat tanggal hari ini. Streak = hitung mundur selama hari berturut-turut ada. Simpan ke [[localStorage]] agar tidak hilang.'),
 A_('langkah2.js','js',[
  ['const KEY = "kebun-mini";','Nama laci penyimpanan.','Kunci untuk localStorage.','Hindari bentrok dengan data lain.'],
  ['const pad = n => String(n).padStart(2, "0");','Tanggal harus 2 digit.','Fungsi kecil dari js1.js asli.'],
  ['const dstr = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());','Format seragam YYYY-MM-DD.','Mengubah Date jadi teks.','Mudah disimpan & dibandingkan.'],
  ['const today = () => dstr(new Date());'],
  ['const addDays = (s, n) => { const [y, m, d] = s.split("-").map(Number); const x = new Date(y, m - 1, d + n); return dstr(x); };','Mundur satu hari dengan benar (pergantian bulan).','Menambah n hari.','Inti streak.'],
  ['let S = JSON.parse(localStorage.getItem(KEY) || \'{"hari":{}}\');','Ambil data lama atau mulai kosong.','Teks → objek.','Kunci agar data tidak hilang saat ditutup.'],
  ['const save = () => localStorage.setItem(KEY, JSON.stringify(S));','Simpan perubahan.','Objek → teks.'],
  ['function streak() {','Menghitung streak.'],
  ['  let n = 0, d = S.hari[today()] ? today() : addDays(today(), -1);','Jika hari ini belum, streak kemarin belum putus.','Titik mulai.','Aturan adil dari Kebun asli.'],
  ['  while (S.hari[d]) { n++; d = addDays(d, -1); }','Mundur selama ada.','Hitung berturut-turut.','Berhenti di hari kosong.'],
  ['  return n;'],['}'],
  ['document.querySelector("#tandai").onclick = () => { S.hari[today()] = true; save(); tampil(); };','Klik = catat hari ini (boleh berkali-kali, hari sama tetap satu).','Mengubah state lalu menggambar ulang.','Pola: ubah S → save() → render.']]),
 G_({code:'<button id="tandai">Tandai hari ini</button> 🔥 <b id="streak">0</b>\n<script>\n  const KEY = "kebun-mini";\n  let S = {hari:{}};\n  try { S = JSON.parse(localStorage.getItem(KEY) || \'{"hari":{}}\'); } catch(e) {}\n  const pad = n => String(n).padStart(2,"0");\n  const today = () => { const d = new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); };\n  // TODO: buat fungsi streak() dan tampil()\n  function tampil(){ document.querySelector("#streak").textContent = 0; }\n  document.querySelector("#tandai").onclick = () => { S.hari[today()] = true; tampil(); };\n  tampil();\n<\/script>',goal:'lengkapi [[tampil()]] agar menampilkan jumlah hari berturut-turut (untuk tes cukup: 1 jika hari ini sudah ditandai). Klik tombol dua kali: tetap 1.',check:(d)=>{const b=d.querySelector('#tandai'),s=d.querySelector('#streak');b.click();const a=s.textContent.trim();b.click();return a==='1'&&s.textContent.trim()==='1'},sol:'<button id="tandai">Tandai hari ini</button> 🔥 <b id="streak">0</b>\n<script>\n let S={hari:{}};\n const pad=n=>String(n).padStart(2,"0");\n const today=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};\n function tampil(){let n=0;const d=new Date();while(S.hari[(()=>{return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())})()]){n++;d.setDate(d.getDate()-1)}document.querySelector("#streak").textContent=n}\n document.querySelector("#tandai").onclick=()=>{S.hari[today()]=true;tampil()};\n tampil();\n<\/script>'}),
 D_('streak'),
 Z_('Kenapa tanggal disimpan sebagai teks "2026-11-07"?',['Karena lebih cantik','Mudah dibandingkan, diurutkan, dan disimpan di JSON','Karena Date rusak','Wajib oleh browser'],1,'Teks tanggal seragam gampang jadi kunci objek dan diurutkan.')]},
{id:'bz3',t:'Bangun sendiri #3: halaman & router mini',say:'Satu file, banyak "halaman". Kita buat router mini dengan <b>data-go</b> dan atribut <b>hidden</b>, seperti Kebun asli.',blocks:[

 G_({code:'<nav>\n  <button data-go="beranda">Beranda</button>\n  <button data-go="akun">Akun</button>\n</nav>\n<section id="p-beranda">🏠 Beranda</section>\n<section id="p-akun" hidden>👤 Akun</section>\n<script>\n  const PAGES = ["beranda", "akun"];\n  function go(n) {\n    // sembunyikan semua, tampilkan satu\n  }\n  // pasang satu listener klik di document untuk [data-go]\n<\/script>',goal:'lengkapi [[go()]] dan pasang listener klik pada [[document]] memakai [[closest("[data-go]")]]. Klik "Akun" harus menampilkan #p-akun dan menyembunyikan #p-beranda.',check:(d)=>{const b=d.querySelector('[data-go=akun]');if(!b)return false;b.click();return !d.querySelector('#p-akun').hidden&&d.querySelector('#p-beranda').hidden},sol:'<nav>\n<button data-go="beranda">Beranda</button>\n<button data-go="akun">Akun</button>\n</nav>\n<section id="p-beranda">🏠 Beranda</section>\n<section id="p-akun" hidden>👤 Akun</section>\n<script>\n const PAGES=["beranda","akun"];\n function go(n){PAGES.forEach(x=>document.querySelector("#p-"+x).hidden=x!==n)}\n document.addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g)go(g.dataset.go)});\n<\/script>'}),

{id:'bz4',t:'Bangun sendiri #4: timer & koin',say:'Timer yang jujur (pakai Date.now) dan koin dengan <b>batas harian</b> agar tidak bisa dicurangi klik berulang.',blocks:[
 A_('timer-koin.js','js',[
  ['const T = { running: false, start: 0, acc: 0 };','Satu objek menyimpan status timer.','[[acc]] = waktu terkumpul saat dijeda.','Mudah disimpan dan dibaca.'],
  ['const elapsed = () => T.acc + (T.running ? Date.now() - T.start : 0);','Hitung waktu dari jam sistem.','Terkumpul + (sekarang - mulai).','Akurat walau tab di latar belakang.'],
  ['function toggle() {','Mulai / jeda.'],
  ['  if (T.running) { T.acc += Date.now() - T.start; T.running = false; }','Jeda: simpan waktu ke acc.'],
  ['  else { T.start = Date.now(); T.running = true; }','Mulai: catat saat mulai.'],
  ['}'],
  ['const CAP = 40; let hariIni = 0, koin = 0;','Batas koin harian.'],
  ['function earn(n) {','Pintu tunggal penambah koin.'],
  ['  n = Math.min(n, Math.max(0, CAP - hariIni));','Jangan melebihi sisa jatah.','Memotong n.','Mencegah farming.'],
  ['  hariIni += n; koin += n; return n;','Catat dan kembalikan jumlah sebenarnya.']]),
 G_({code:'<button id="plus">+5 koin</button> 🪙 <b id="koin">0</b>\n<script>\n  const CAP = 10;\n  let hariIni = 0, koin = 0;\n  function earn(n) {\n    // batasi sampai CAP per hari\n    koin += n;\n  }\n  document.querySelector("#plus").onclick = () => {\n    earn(5);\n    document.querySelector("#koin").textContent = koin;\n  };\n<\/script>',goal:'ubah [[earn()]] agar total koin tidak pernah melebihi [[CAP]] (10). Klik 3 kali: koin harus 10.',check:(d)=>{const b=d.querySelector('#plus'),k=d.querySelector('#koin');b.click();b.click();b.click();return k.textContent.trim()==='10'},sol:'<button id="plus">+5 koin</button> 🪙 <b id="koin">0</b>\n<script>\n const CAP=10;let hariIni=0,koin=0;\n function earn(n){n=Math.min(n,Math.max(0,CAP-hariIni));hariIni+=n;koin+=n}\n document.querySelector("#plus").onclick=()=>{earn(5);document.querySelector("#koin").textContent=koin};\n<\/script>'}),
 D_('timer'),D_('earn'),
 Z_('Kenapa timer memakai [[Date.now()]] bukan menambah 1 tiap tick?',['Biar keren','Tick bisa tertunda saat tab di latar belakang; jam sistem tetap akurat','Karena Date lebih cepat','Tidak ada alasan'],1,'Selisih jam sistem selalu benar.')]},
{id:'bz5',t:'Bangun sendiri #5: Kebun Mini utuh',say:'Saatnya digabung! Ini versi mini Kebun Murojaah dalam satu file: tema, streak, koin, dua halaman. Salin ke Lab dan modifikasi sesukamu!',blocks:[
 P_('Ketuk <b>Buka di Lab</b> pada kotak di bawah. Lalu coba: ganti warna variabel, tambah halaman "Catatan", atau tambah tombol koin lain. Panel Masalah di Lab akan membantumu kalau salah.'),
 G_({code:'<!doctype html>\n<html lang="id">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>Kebun Mini</title>\n<style>\n  :root{ --page:#fde7ef; --paper:#fff; --line:#6d65c8; --ink:#3b3585; --pink:#e07fb5; }\n  *{ box-sizing:border-box }\n  body{ margin:0; padding:16px; background:var(--page); color:var(--ink); font-family:system-ui,sans-serif }\n  .pil{ display:inline-block; padding:4px 14px; border:3px solid var(--line); border-radius:999px; background:var(--paper); font-weight:700 }\n  .kartu{ margin-top:14px; padding:16px; background:var(--paper); border:3px dashed var(--line); border-radius:20px }\n  button{ padding:6px 16px; border:3px solid var(--line); border-radius:999px; background:var(--pink); color:#fff; font-weight:700 }\n  [hidden]{ display:none !important }\n</style>\n</head>\n<body>\n<header>\n  <h1>Kebun Mini</h1>\n  <span class="pil">🔥 <b id="streak">0</b> hari</span>\n  <span class="pil">🪙 <b id="koin">0</b></span>\n</header>\n<nav style="margin-top:12px">\n  <button data-go="beranda">Beranda</button>\n  <button data-go="tentang">Tentang</button>\n</nav>\n<section id="p-beranda" class="kartu">\n  <h2>Murojaah hari ini</h2>\n  <button id="tandai">Tandai selesai (+5 koin)</button>\n</section>\n<section id="p-tentang" class="kartu" hidden>\n  <h2>Tentang</h2><p>Ini versi mini buatanku sendiri 🎀</p>\n</section>\n<script>\n  const KEY="kebun-mini-utuh", CAP=40;\n  const pad=n=>String(n).padStart(2,"0");\n  const dstr=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());\n  const today=()=>dstr(new Date());\n  const addDays=(s,n)=>{const [y,m,d]=s.split("-").map(Number);return dstr(new Date(y,m-1,d+n))};\n  let S={hari:{},koin:0,ei:{d:"",n:0}};\n  try{ Object.assign(S, JSON.parse(localStorage.getItem(KEY)||"{}")); }catch(e){}\n  const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} };\n  function streak(){ let n=0,d=S.hari[today()]?today():addDays(today(),-1); while(S.hari[d]){n++;d=addDays(d,-1)} return n; }\n  function earn(n){ const t=today(); if(S.ei.d!==t) S.ei={d:t,n:0}; n=Math.min(n,Math.max(0,CAP-S.ei.n)); S.ei.n+=n; S.koin+=n; return n; }\n  function render(){ document.querySelector("#streak").textContent=streak(); document.querySelector("#koin").textContent=S.koin; }\n  function go(n){ ["beranda","tentang"].forEach(x=>document.querySelector("#p-"+x).hidden=x!==n); }\n  document.addEventListener("click",e=>{\n    const g=e.target.closest("[data-go]"); if(g){ go(g.dataset.go); return; }\n    if(e.target.id==="tandai"){ if(!S.hari[today()]){ S.hari[today()]=true; earn(5); } save(); render(); }\n  });\n  render();\n<\/script>\n</body>\n</html>\n',goal:'tekan [[Jalankan]], klik "Tandai selesai": streak jadi 1 dan koin 5. Klik lagi: tidak bertambah (sudah ditandai hari ini).',check:(d)=>{const b=d.querySelector('#tandai');if(!b)return false;b.click();b.click();return d.querySelector('#streak').textContent.trim()==='1'&&d.querySelector('#koin').textContent.trim()==='5'},sol:null}),
 H_('Perbandingan dengan Kebun asli'),
 T_(['Fitur','Kebun Mini','Kebun Murojaah asli'],[['State','[[S]] kecil','[[S]] besar + [[migrate()]] untuk versi lama'],['Router','[[go()]] + hidden','[[PAGES]], [[P]], [[renderPage()]], hash URL'],['Event','1 listener klik','klik + change + submit, peta [[ACT]]'],['Simpan','localStorage','localStorage + Firebase opsional'],['Tema','1 set variabel','19 tema via [[data-skin]] + mode gelap']]),

{id:'bz6',t:'Service worker (sw.js asli)',say:'Berkas [[sw.js]] di Kebun Murojaah kecil banget: hanya 10 baris! Tugasnya khusus notifikasi pengingat.',blocks:[
 P_('Service worker adalah skrip yang berjalan di <b>latar belakang browser</b>, terpisah dari halaman. Di Kebun asli dipakai untuk satu hal: menampilkan notifikasi pengingat dan membuka web saat notifikasi diketuk. (Tidak dipakai untuk cache/offline.)'),
 A_('sw.js (asli, seluruhnya)','js',[
  ['self.addEventListener("install",()=>self.skipWaiting());','Service worker baru biasanya menunggu halaman lama ditutup.','[[skipWaiting()]] langsung mengaktifkan versi baru.','Pembaruan tidak tertunda.'],
  ['self.addEventListener("activate",e=>e.waitUntil(self.clients.claim()));','Halaman yang sudah terbuka belum dikendalikan.','[[clients.claim()]] membuatnya mengendalikan semua tab sekarang.','Notifikasi langsung berfungsi.'],
