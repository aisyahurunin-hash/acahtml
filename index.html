<title>Belajar Ngoding Pita</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Nunito:wght@400;700;800&family=Yesteryear&display=swap" rel="stylesheet">
<style>
/* Layout: satu bingkai bertema (header belang + lengkung putih berpita, tab pill, panel putih di atas latar berpola). Semua warna turunan dari 3 hue tema: --hm utama, --ha aksen, --hb pelengkap. */
:root{
  --hm:255; --ha:330; --hb:225;
  --bg:hsl(var(--hm) 62% 78%); --arg:hsl(var(--hm) 58% 72%); --dots:hsl(var(--hm) 80% 87%);
  --frame:hsl(var(--hm) 100% 97%); --paper:#fff; --panel:hsl(var(--hm) 70% 90%); --stA:hsl(var(--hm) 70% 84%); --stB:hsl(var(--hm) 80% 91%);
  --ink:hsl(var(--hm) 45% 27%); --ink2:hsl(var(--hm) 30% 40%); --line:hsl(var(--hm) 50% 52%);
  --pink:hsl(var(--ha) 65% 66%); --pink2:hsl(var(--ha) 62% 42%); --pinkbtn:hsl(var(--ha) 62% 48%); --pinkbg:hsl(var(--ha) 85% 91%); --pinkbg2:hsl(var(--ha) 90% 96%);
  --lav:hsl(var(--hm) 70% 92%); --lav2:hsl(var(--hm) 70% 80%); --blue:hsl(var(--hb) 75% 91%); --blue2:hsl(var(--hb) 52% 42%);
  --ok:#23724f; --okbg:#d6efe2; --bad:#b3314f; --badbg:#fde0e8; --warn:#8a4709; --warnbg:#fff0d6; --info:#2d5fa8; --infobg:#e3eefc;
  --codebg:hsl(var(--hm) 100% 98%); --code:hsl(var(--hm) 50% 22%); --codebar:hsl(var(--hm) 70% 93%);
  --tk-kw:#a8308f; --tk-str:#1d7552; --tk-com:#7b77aa; --tk-num:#a94d17; --tk-tag:#3f55c0; --tk-prop:#7a3bb3; --tk-fn:#b04a00;
  --f-disp:"Yesteryear","Brush Script MT",cursive; --f-body:"Nunito","Segoe UI",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:hsl(var(--hm) 35% 13%); --arg:hsl(var(--hm) 32% 17%); --dots:hsl(var(--hm) 30% 21%);
  --frame:hsl(var(--hm) 30% 20%); --paper:hsl(var(--hm) 28% 25%); --panel:hsl(var(--hm) 32% 16%); --stA:hsl(var(--hm) 35% 30%); --stB:hsl(var(--hm) 35% 36%);
  --ink:hsl(var(--hm) 90% 94%); --ink2:hsl(var(--hm) 60% 82%); --line:hsl(var(--hm) 65% 74%);
  --pink:hsl(var(--ha) 100% 80%); --pink2:hsl(var(--ha) 100% 83%); --pinkbtn:hsl(var(--ha) 55% 42%); --pinkbg:hsl(var(--ha) 35% 30%); --pinkbg2:hsl(var(--ha) 30% 24%);
  --lav:hsl(var(--hm) 35% 31%); --lav2:hsl(var(--hm) 35% 42%); --blue:hsl(var(--hb) 40% 28%); --blue2:hsl(var(--hb) 100% 84%);
  --ok:#9ae6c0; --okbg:#2a4d47; --bad:#ffa3b8; --badbg:#5a2f46; --warn:#ffcb8a; --warnbg:#4f3c33; --info:#a9c8ff; --infobg:#2c3f66;
  --codebg:hsl(var(--hm) 35% 17%); --code:hsl(var(--hm) 100% 95%); --codebar:hsl(var(--hm) 35% 27%);
  --tk-kw:#ff9bdc; --tk-str:#8ff0bf; --tk-com:#9a96c9; --tk-num:#ffb77d; --tk-tag:#9fb3ff; --tk-prop:#d3a6ff; --tk-fn:#ffd27d;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:hsl(var(--hm) 35% 13%); --arg:hsl(var(--hm) 32% 17%); --dots:hsl(var(--hm) 30% 21%);
  --frame:hsl(var(--hm) 30% 20%); --paper:hsl(var(--hm) 28% 25%); --panel:hsl(var(--hm) 32% 16%); --stA:hsl(var(--hm) 35% 30%); --stB:hsl(var(--hm) 35% 36%);
  --ink:hsl(var(--hm) 90% 94%); --ink2:hsl(var(--hm) 60% 82%); --line:hsl(var(--hm) 65% 74%);
  --pink:hsl(var(--ha) 100% 80%); --pink2:hsl(var(--ha) 100% 83%); --pinkbtn:hsl(var(--ha) 55% 42%); --pinkbg:hsl(var(--ha) 35% 30%); --pinkbg2:hsl(var(--ha) 30% 24%);
  --lav:hsl(var(--hm) 35% 31%); --lav2:hsl(var(--hm) 35% 42%); --blue:hsl(var(--hb) 40% 28%); --blue2:hsl(var(--hb) 100% 84%);
  --ok:#9ae6c0; --okbg:#2a4d47; --bad:#ffa3b8; --badbg:#5a2f46; --warn:#ffcb8a; --warnbg:#4f3c33; --info:#a9c8ff; --infobg:#2c3f66;
  --codebg:hsl(var(--hm) 35% 17%); --code:hsl(var(--hm) 100% 95%); --codebar:hsl(var(--hm) 35% 27%);
  --tk-kw:#ff9bdc; --tk-str:#8ff0bf; --tk-com:#9a96c9; --tk-num:#ffb77d; --tk-tag:#9fb3ff; --tk-prop:#d3a6ff; --tk-fn:#ffd27d;
  color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--f-body);font-size:16px;line-height:1.7;color:var(--ink);
  background-color:var(--bg);
  background-image:var(--pat1,repeating-conic-gradient(from 45deg,var(--arg) 0 25%,transparent 0 50%)),var(--pat2,radial-gradient(var(--dots) 1.6px,transparent 2px));
  background-size:var(--ps1,150px 150px),var(--ps2,14px 14px);
  padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--pink2)}
:focus-visible{outline:3px solid var(--blue2);outline-offset:2px;border-radius:8px}
#wrap{max-width:1020px;margin:0 auto;background:var(--frame);border:4px solid var(--line);border-radius:30px;overflow:hidden;box-shadow:0 8px 0 color-mix(in srgb,var(--line) 35%,transparent)}
/* header */
.hd{position:relative;background:repeating-linear-gradient(90deg,var(--stA) 0 26px,var(--stB) 26px 52px);padding:46px 16px 0}
.hd::before{content:"";position:absolute;left:0;right:0;top:0;height:16px;background:radial-gradient(circle at 12px 0,var(--paper) 0 10px,transparent 11px) 0 0/24px 16px repeat-x}
.arch{position:relative;max-width:680px;margin:0 auto;background:var(--paper);border:3px solid var(--line);border-bottom:0;border-radius:340px 340px 0 0/150px 150px 0 0;padding:56px 28px 14px;text-align:center}
.arch::after{content:"";position:absolute;inset:8px 8px 0;border:2px dashed color-mix(in srgb,var(--pink) 70%,transparent);border-bottom:0;border-radius:330px 330px 0 0/142px 142px 0 0;pointer-events:none}
.bow{position:absolute;left:50%;top:-22px;width:120px;transform:translateX(-50%);z-index:2}
.doily{position:absolute;top:26px;width:84px;height:84px}
.doily.l{left:2%}.doily.r{right:2%}
h1.logo{font-family:var(--f-disp);font-weight:400;font-size:clamp(2.1rem,6.4vw,3.5rem);line-height:1.15;margin:0;color:var(--pink2);text-shadow:2px 2px 0 var(--lav2);text-wrap:balance}
.tagline{margin:2px 0 0;font-size:.95rem;color:var(--ink2);font-weight:700}
.hd-tools{position:absolute;right:12px;top:22px;display:flex;gap:6px;z-index:3}
.ibtn{width:38px;height:38px;border-radius:50%;border:3px solid var(--line);background:var(--paper);display:grid;place-items:center;color:var(--ink)}
.ibtn svg{width:20px;height:20px}
/* tabs */
.tabs{background:var(--paper);display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:6px 16px 16px}
.tab{padding:6px 18px 8px;border:3px dashed var(--pink);border-radius:20px;background:repeating-linear-gradient(90deg,var(--pinkbg) 0 9px,var(--paper) 9px 18px);font-family:var(--f-disp);font-size:1.3rem;line-height:1.3;color:var(--pink2);box-shadow:0 4px 0 color-mix(in srgb,var(--pink) 45%,transparent)}
.tab:nth-child(3n+2){border-color:var(--lav2);background:repeating-linear-gradient(90deg,var(--lav) 0 9px,var(--paper) 9px 18px);color:var(--ink);box-shadow:0 4px 0 color-mix(in srgb,var(--lav2) 70%,transparent)}
.tab:nth-child(3n){border-color:var(--blue2);background:repeating-linear-gradient(90deg,var(--blue) 0 9px,var(--paper) 9px 18px);color:var(--blue2);box-shadow:0 4px 0 color-mix(in srgb,var(--blue2) 35%,transparent)}
.tab[aria-current="page"]{border-style:solid;transform:translateY(3px);box-shadow:none;background:var(--pinkbtn);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.tab:nth-child(3n+2)[aria-current="page"]{background:var(--line)}
.tab:nth-child(3n)[aria-current="page"]{background:var(--blue2)}
.argyle{height:18px;background:repeating-conic-gradient(from 45deg,var(--lav2) 0 25%,var(--paper) 0 50%) 0 0/18px 18px;border-block:2px solid var(--lav2)}
.stats{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:center;background:var(--lav);padding:8px 16px;font-size:.88rem;font-weight:800;color:var(--ink)}
.xpbar{flex:1 1 140px;max-width:260px;height:14px;border-radius:999px;border:2.5px solid var(--line);background:var(--paper);overflow:hidden}
.xpbar i{display:block;height:100%;background:repeating-linear-gradient(135deg,var(--pink) 0 8px,color-mix(in srgb,var(--pink) 70%,#fff) 8px 16px);transition:width .5s}
/* main */
.main{background:var(--panel);padding:18px}
.panel{background:var(--paper);border:3px solid var(--line);border-radius:24px;padding:22px 22px 26px}
.plaid{background-color:var(--pinkbg);background-image:repeating-linear-gradient(0deg,color-mix(in srgb,var(--pink) 30%,transparent) 0 9px,transparent 9px 18px),repeating-linear-gradient(90deg,color-mix(in srgb,var(--pink) 30%,transparent) 0 9px,transparent 9px 18px);border-radius:18px;padding:14px;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:18px}
.btnc{flex:none;width:44px;height:44px}
.ptitle{margin:0;min-width:0;background:repeating-linear-gradient(135deg,var(--lav) 0 14px,var(--paper) 14px 28px);border:3px solid var(--line);border-radius:999px;padding:4px 28px 7px;font-family:var(--f-disp);font-weight:400;font-size:clamp(1.3rem,4vw,1.9rem);line-height:1.3;color:var(--ink);text-align:center;text-wrap:balance}
.rib{display:inline-block;margin:6px 0 10px;padding:5px 30px 7px;background:var(--lav);color:var(--ink);font-family:var(--f-disp);font-weight:400;font-size:1.45rem;line-height:1.3;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 50%,100% 100%,0 100%,14px 50%);box-shadow:inset 0 3px 0 var(--line),inset 0 -3px 0 var(--line)}
h3.sub{font-size:1.12rem;font-weight:800;color:var(--ink);margin:22px 0 4px}
h3.sub::before{content:"\2726";color:var(--pink);margin-right:8px}
p{margin:0 0 12px;max-width:72ch}
.lead{font-size:1.06rem}
code.i{font-family:var(--f-mono);font-size:.86em;background:var(--lav);color:var(--ink);padding:1px 6px;border-radius:7px;white-space:pre-wrap;overflow-wrap:anywhere}
ul.l,ol.l{margin:0 0 14px;padding-left:22px;max-width:72ch}
ul.l li,ol.l li{margin-bottom:6px}
.lace{height:14px;margin:18px 0;background:radial-gradient(circle at 10px 6px,var(--paper) 0 7px,var(--lav2) 7px 9px,transparent 9.5px) 0 0/20px 14px repeat-x}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{display:flex;gap:7px;align-items:center;padding:5px 13px;border:2.5px solid var(--line);border-radius:999px;background:var(--paper);font-weight:800;font-size:.88rem;color:var(--ink)}
.chip[aria-current="true"]{background:var(--pinkbtn);border-color:var(--pink2);color:#fff}
.chip .ck{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font-size:.7rem;flex:none}
.chip.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 18px;border:3px solid var(--line);border-radius:999px;background:var(--lav);color:var(--ink);font-weight:800;box-shadow:0 3px 0 color-mix(in srgb,var(--line) 55%,transparent)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.p{background:var(--pinkbtn);border-color:var(--pink2);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn.s{padding:4px 13px;font-size:.85rem}
.btn.g{background:var(--paper)}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tag{display:inline-block;padding:1px 10px;border-radius:999px;background:var(--lav);border:2px solid var(--lav2);font-size:.74rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ink)}
/* mascot */
.mascot{display:flex;gap:12px;align-items:flex-end;margin:0 0 18px}
.mascot svg{width:84px;flex:none}
.bub{position:relative;background:var(--pinkbg2);border:3px solid var(--pink);border-radius:20px;padding:10px 14px;font-weight:700;font-size:.95rem;min-width:0}
.bub::before{content:"";position:absolute;left:-12px;bottom:18px;width:18px;height:18px;background:var(--pinkbg2);border-left:3px solid var(--pink);border-bottom:3px solid var(--pink);transform:rotate(45deg)}
.bub b{color:var(--pink2)}
/* callouts */
.note{position:relative;margin:18px 0 14px;padding:16px 16px 12px;border:3px dashed var(--lav2);border-radius:16px;background:var(--codebg);max-width:78ch}
.note>.tag{position:absolute;top:-13px;left:14px}
.note.tip{border-color:var(--ok);background:var(--okbg)}.note.tip>.tag{background:var(--ok);border-color:var(--ok);color:#fff}
.note.warn{border-color:var(--warn);background:var(--warnbg)}.note.warn>.tag{background:var(--warn);border-color:var(--warn);color:#fff}
.note p:last-child{margin-bottom:0}
/* kode beranotasi */
.ann{border:3px solid var(--line);border-radius:16px;overflow:hidden;margin:14px 0;background:var(--codebg)}
.ann-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:var(--codebar);padding:7px 12px;font-family:var(--f-mono);font-size:.8rem;font-weight:600;color:var(--ink)}
.ag{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:0 12px;width:100%;text-align:left;background:none;border:0;border-top:1.5px dashed color-mix(in srgb,var(--line) 35%,transparent);padding:7px 12px;color:var(--code)}
.ag:hover,.ag[aria-expanded="true"]{background:color-mix(in srgb,var(--pink) 14%,transparent)}
.ag .no{font-family:var(--f-mono);font-size:.74rem;color:var(--tk-com);text-align:right;min-width:2.4ch;white-space:pre;padding-top:3px;user-select:none}
.ag pre{margin:0;min-width:0;overflow-x:auto;font-family:var(--f-mono);font-size:.84rem;line-height:1.6;white-space:pre}
.ag .q{align-self:start;width:22px;height:22px;border-radius:50%;background:var(--pinkbtn);color:#fff;font-weight:800;font-size:.8rem;display:grid;place-items:center;margin-top:1px}
.ag[aria-expanded="true"] .q{background:var(--line)}
.an{padding:10px 14px 12px 14px;background:var(--pinkbg2);border-top:2px solid var(--pink);font-size:.95rem;line-height:1.65}
.an p{margin:0 0 8px;max-width:none}.an p:last-child{margin-bottom:0}
.an .why{display:block;font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--pink2);margin-bottom:2px}
.tk-kw{color:var(--tk-kw);font-weight:600}.tk-fn{color:var(--tk-fn)}.tk-str{color:var(--tk-str)}.tk-com{color:var(--tk-com);font-style:italic}.tk-num{color:var(--tk-num)}.tk-tag{color:var(--tk-tag);font-weight:600}.tk-prop{color:var(--tk-prop)}
/* playground */
.pg{border:3px solid var(--line);border-radius:18px;overflow:hidden;margin:16px 0;background:var(--paper)}
.pg-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:var(--codebar);padding:8px 12px}
.pg-tabs{display:flex;gap:6px}
.pg-tabs button{padding:3px 12px;border-radius:999px;border:2.5px solid var(--line);background:var(--paper);font-family:var(--f-mono);font-size:.78rem;font-weight:600}
.pg-tabs button[aria-pressed="true"]{background:var(--pinkbtn);border-color:var(--pink2);color:#fff}
.pg-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:760px){.pg-body{grid-template-columns:minmax(0,1fr)}}
.pg textarea{display:block;width:100%;height:100%;min-height:230px;border:0;border-right:2px dashed var(--lav2);padding:12px;background:var(--codebg);color:var(--code);font-family:var(--f-mono);font-size:.84rem;line-height:1.55;resize:vertical;tab-size:2;white-space:pre;overflow:auto}
.pg-out{min-width:0;display:flex;flex-direction:column;background:#fff}
.pg-out iframe{flex:1;width:100%;min-height:230px;border:0;background:#fff;display:block}
.pg-con{background:#241f4d;color:#efeaff;font-family:var(--f-mono);font-size:.8rem;padding:8px 12px;max-height:150px;overflow:auto;white-space:pre-wrap}
.pg-con:empty{display:none}
.pg-con .err{color:#ff9db8}
.pg-f{padding:9px 12px;border-top:2px dashed var(--lav2);display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:.9rem}
.goal{flex:1 1 220px;min-width:0}
.res{font-weight:800}.res.ok{color:var(--ok)}.res.bad{color:var(--bad)}
/* kuis */
.qz{border:3px solid var(--line);border-radius:18px;padding:16px 16px 14px;margin:18px 0;background:var(--paper)}
.qz .qq{font-weight:800;margin:0 0 10px}
.qz .qo{display:block;width:100%;text-align:left;margin:0 0 8px;padding:9px 14px;border:3px solid var(--lav2);border-radius:14px;background:var(--paper);font-weight:700;color:var(--ink)}
.qz .qo:hover:not([disabled]){background:var(--lav)}
.qz .qo.good{background:var(--okbg);border-color:var(--ok)}
.qz .qo.bad{background:var(--badbg);border-color:var(--bad)}
.qz .qo[disabled]{cursor:default}
.qz .why{margin-top:6px;padding:10px 12px;border-radius:12px;background:var(--pinkbg2);border:2px dashed var(--pink);font-size:.95rem}
.qz .tag{margin-bottom:8px}
/* demo */
.demo{border:3px solid var(--line);border-radius:18px;margin:18px 0;background:var(--paper);overflow:hidden}
.demo-h{background:var(--pinkbtn);color:#fff;padding:5px 14px;font-family:var(--f-disp);font-size:1.2rem;line-height:1.4;text-shadow:0 1px 0 rgba(0,0,0,.2)}
.demo-b{padding:14px;display:grid;gap:12px;min-width:0}
.ctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.ctl label{font-weight:800;font-size:.86rem;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ctl input[type=range]{accent-color:var(--pink2);width:130px}
.ctl select,.ctl input[type=text],.ctl input[type=number],.ctl input[type=search]{border:2.5px solid var(--line);border-radius:12px;padding:4px 10px;background:var(--paper);color:var(--ink);min-width:0;max-width:100%}
.ctl input[type=color]{width:38px;height:30px;border:2.5px solid var(--line);border-radius:8px;padding:0;background:var(--paper)}
.codeout{margin:0;background:var(--codebg);border:2px dashed var(--lav2);border-radius:12px;padding:10px 12px;font-family:var(--f-mono);font-size:.8rem;line-height:1.55;overflow-x:auto;white-space:pre;color:var(--code)}
.stage{border:2.5px dashed var(--lav2);border-radius:14px;background:var(--frame);padding:14px;min-height:120px;min-width:0;overflow:auto}
.logbox{background:#241f4d;color:#efeaff;font-family:var(--f-mono);font-size:.8rem;border-radius:12px;padding:8px 12px;min-height:56px;max-height:160px;overflow:auto;white-space:pre-wrap}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days button{width:36px;height:42px;border-radius:10px;border:2.5px solid var(--line);background:var(--paper);font-size:.7rem;font-weight:800;color:var(--ink);line-height:1.2}
.days button[aria-pressed="true"]{background:var(--pinkbtn);border-color:var(--pink2);color:#fff}
.days button.cut{outline:3px solid var(--blue2)}
table.t{border-collapse:collapse;width:100%;font-size:.88rem}
table.t th{text-align:left;border-bottom:3px solid var(--line);padding:5px 8px;font-size:.76rem;white-space:nowrap}
table.t td{padding:6px 8px;border-bottom:1.5px dashed var(--lav2)}
.scroll{overflow-x:auto;max-width:100%}
/* beranda */
.paths{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:12px 0 4px}
.path{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px;border:3px solid var(--line);border-radius:18px;background:var(--paper);color:var(--ink);box-shadow:0 4px 0 color-mix(in srgb,var(--line) 40%,transparent)}
.path:hover{background:var(--lav)}
.path .pn{font-family:var(--f-disp);font-size:1.5rem;line-height:1.2;color:var(--pink2)}
.path .pd{font-size:.88rem;line-height:1.5;flex:1}
.mini{height:10px;border-radius:999px;border:2px solid var(--line);background:var(--paper);overflow:hidden}
.mini i{display:block;height:100%;background:var(--pink)}

function themeApply(id){

  r.style.setProperty('--hm',t[2]);r.style.setProperty('--ha',t[3]);r.style.setProperty('--hb',t[4]);

  const i=view.ch,fav=S.fav&&S.fav[ch.id];
  return '<div class="plaid"><h2 class="ptitle">'+esc(b.name)+'</h2></div><div class="chips">'+chips+'</div>'
   +'<div class="mascot">'+MASCOT+'<div class="bub">'+rich(ch.say)+'</div></div>'
   +'<div class="row" style="justify-content:space-between"><span class="rib">'+esc(ch.t)+'</span><button class="btn s g" data-a="fav" data-id="'+ch.id+'" aria-pressed="'+!!fav+'">'+(fav?'★ Tersimpan':'☆ Bookmark')+'</button></div>'+ch.blocks.map(x=>blk(x,ch)).join('')

   +'<div class="row" style="margin-top:12px"><button class="btn p" data-a="finish" data-id="'+ch.id+'" '+(S.done[ch.id]?'disabled':'')+'>'+(S.done[ch.id]?'✓ Bab ini sudah selesai':'Tandai selesai (+10 XP)')+'</button></div>'
   +'<div class="nav2"><button class="btn" data-a="goch" data-t="'+view.tab+'" data-c="'+(i-1)+'" '+(i<=0?'disabled':'')+'>← Sebelumnya</button><button class="btn" data-a="goch" data-t="'+view.tab+'" data-c="'+(i+1)+'" '+(i>=b.ch.length-1?'disabled':'')+'>Berikutnya →</button></div>';

/* ---------- Kamus: daftar, kartu hafalan, tebak istilah ---------- */
const KM={q:'',cat:'Semua',mode:'list',n:60,card:0,flip:false,tq:null};
function kmFiltered(){const q=KM.q.trim().toLowerCase();return GLOSS.filter(g=>(KM.cat==='Semua'||g[2]===KM.cat||(KM.cat==='★ Favorit'&&S.gfav&&S.gfav[g[0]]))&&(!q||g[0].toLowerCase().includes(q)||g[1].toLowerCase().includes(q)))}
function kamusHtml(){
  const cats=['Semua','★ Favorit'].concat([...new Set(GLOSS.map(g=>g[2]))]);
  const known=Object.keys(S.known||{}).length;
  let h='<div class="plaid"><h2 class="ptitle">Kamus Ngoding</h2></div>'
   +'<div class="mascot">'+MASCOT+'<div class="bub">'+GLOSS.length+' istilah web &amp; pemrograman! Kamu sudah hafal <b>'+known+'</b>. Coba mode <b>Kartu hafalan</b> atau <b>Tebak istilah</b> biar cepat nempel.</div></div>'
   +'<div class="row"><div class="seg">'+[['list','Daftar'],['kartu','Kartu hafalan'],['tebak','Tebak istilah']].map(m=>'<button data-a="kmmode" data-m="'+m[0]+'" aria-pressed="'+(KM.mode===m[0])+'">'+m[1]+'</button>').join('')+'</div>'
   +'<input id="kmq" type="search" placeholder="Cari istilah…" value="'+esc(KM.q)+'" aria-label="Cari istilah"></div>'
   +'<div class="chips" style="margin-top:12px">'+cats.map(c=>'<button class="chip" data-a="kmcat" data-c="'+esc(c)+'" '+(KM.cat===c?'aria-current="true"':'')+'>'+esc(c)+'</button>').join('')+'</div><div id="kmBody"></div>';
  return h;
}
function kamusBody(){
  const b=$('#kmBody');if(!b)return;const L=kmFiltered();
  if(KM.mode==='list'){
    b.innerHTML='<p class="tag">'+L.length+' istilah</p>'+L.slice(0,KM.n).map(g=>'<div class="gl2"><div class="gl2-h"><b>'+esc(g[0])+'</b><span class="tag">'+esc(g[2])+'</span><button class="btn s g" data-a="gfav" data-t="'+esc(g[0])+'" aria-label="Favorit">'+(S.gfav&&S.gfav[g[0]]?'★':'☆')+'</button></div><p>'+rich(esc(g[1]).replace(/&#39;/g,"'"))+'</p></div>').join('')+(L.length>KM.n?'<button class="btn" data-a="kmmore">Tampilkan lebih banyak</button>':'');
  }else if(KM.mode==='kartu'){
    if(!L.length){b.innerHTML='<p>Tidak ada istilah di filter ini.</p>';return}
    KM.card=Math.min(KM.card,L.length-1);const g=L[KM.card];
    b.innerHTML='<p class="tag">Kartu '+(KM.card+1)+' dari '+L.length+'</p><button class="fcard" data-a="kmflip" aria-live="polite">'+(KM.flip?'<small>'+esc(g[2])+'</small><span>'+esc(g[1])+'</span>':'<small>ketuk untuk melihat arti</small><b>'+esc(g[0])+'</b>')+'</button><div class="row" style="justify-content:center;margin-top:12px"><button class="btn" data-a="kmprev">←</button><button class="btn" data-a="kmno">Belum hafal</button><button class="btn p" data-a="kmyes">Hafal ✓</button><button class="btn" data-a="kmnext">→</button><button class="btn s g" data-a="kmshuf">Acak</button></div>';
  }else{
    if(!KM.tq){const pool=L.length>=4?L:GLOSS;const a=pool[Math.floor(Math.random()*pool.length)];const same=GLOSS.filter(x=>x[0]!==a[0]);const opts=[a];while(opts.length<4){const o=same[Math.floor(Math.random()*same.length)];if(!opts.includes(o))opts.push(o)}opts.sort(()=>Math.random()-.5);KM.tq={a,opts,done:false}}
    const q=KM.tq;
    b.innerHTML='<div class="qz"><span class="tag">Tebak istilah</span><p class="qq">Apa arti <b>'+esc(q.a[0])+'</b>?</p>'+q.opts.map((o,i)=>'<button class="qo '+(q.done?(o===q.a?'good':(q.pick===i?'bad':'')):'')+'" data-a="kmpick" data-i="'+i+'" '+(q.done?'disabled':'')+'>'+esc(o[1])+'</button>').join('')+(q.done?'<div class="why">'+(q.ok?'Benar! ':'Jawaban benar: ')+'<b>'+esc(q.a[0])+'</b>. <button class="btn s p" data-a="kmnq">Soal berikutnya →</button></div>':'')+'</div>';
  }
}
/* ---------- Kuis acak ---------- */
const KQ={qs:null,i:0,score:0,done:false,answered:false};
function kuisPool(){const p=[];CHAPS().forEach(c=>c.blocks.forEach(b=>{if(b.k==='qz')p.push(b)}));return p}
function kuisNew(){const p=kuisPool().sort(()=>Math.random()-.5).slice(0,10);KQ.qs=p;KQ.i=0;KQ.score=0;KQ.done=false;KQ.answered=false}
function kuisHtml(){
  if(!KQ.qs)kuisNew();
  let h='<div class="plaid"><h2 class="ptitle">Kuis Acak</h2></div>';
  if(KQ.done){const xp=KQ.score*3;return h+'<div class="mascot">'+MASCOT+'<div class="bub">Selesai! Skormu <b>'+KQ.score+' / '+KQ.qs.length+'</b>. '+(KQ.score>=8?'Keren banget!':KQ.score>=5?'Lumayan, ulangi lagi yuk!':'Tenang, baca ulang babnya lalu coba lagi.')+'</div></div><button class="btn p" data-a="kzagain">Main lagi</button>'}
  const q=KQ.qs[KQ.i];
  return h+'<p class="tag">Soal '+(KQ.i+1)+' dari '+KQ.qs.length+' · skor '+KQ.score+'</p><div class="qz"><p class="qq">'+rich(q.q)+'</p>'+q.o.map((o,i)=>'<button class="qo" data-a="kzpick" data-i="'+i+'">'+rich(o)+'</button>').join('')+'<div class="why" hidden>'+rich(q.why)+'<br><button class="btn s p" data-a="kznext" style="margin-top:8px">'+(KQ.i>=KQ.qs.length-1?'Lihat skor':'Berikutnya →')+'</button></div></div>';
}

/* ---------- Cari ---------- */
let SIDX=null;
function chapText(c){return [c.t,c.say].concat(c.blocks.map(b=>b.k==='p'||b.k==='h'?b.t:b.k==='ul'?b.a.join(' '):b.k==='note'?b.h.join(' '):b.k==='tbl'?b.rows.flat().join(' '):b.k==='ann'?b.lines.map(l=>l.join(' ')).join(' '):b.k==='qz'?b.q+' '+b.o.join(' '):b.k==='pg'?(b.goal||''):'')).join(' ').replace(/\[\[|\]\]|<[^>]+>/g,' ')}
function searchIdx(){if(SIDX)return SIDX;SIDX=CHAPS().map(c=>({c,t:chapText(c).toLowerCase()}));return SIDX}
function doSearch(q){
  const box=$('#qres');q=q.trim().toLowerCase();if(q.length<2){box.hidden=true;return}
  const words=q.split(/\s+/);
  const res=searchIdx().map(x=>{let sc=0;const tl=x.c.t.toLowerCase();words.forEach(w=>{if(tl.includes(w))sc+=10;const k=x.t.split(w).length-1;sc+=Math.min(k,5)});return {x,sc,all:words.every(w=>x.t.includes(w))}}).filter(r=>r.all&&r.sc>0).sort((a,b)=>b.sc-a.sc).slice(0,8);
  const gl=(typeof GLOSS!=='undefined'?GLOSS:[]).filter(g=>words.every(w=>(g[0]+' '+g[1]).toLowerCase().includes(w))).slice(0,4);
  const idxOf=c=>BOOK[c.tab].ch.findIndex(x=>x.id===c.id);
  box.innerHTML=(res.length||gl.length?'':'<div class="pr">Tidak ada hasil untuk "'+esc(q)+'".</div>')+res.map(r=>{const t=r.x.t,i=t.indexOf(words[0]);const sn=i<0?'':'…'+esc(t.slice(Math.max(0,i-30),i+70))+'…';return '<button class="sr" data-a="goch" data-t="'+r.x.c.tab+'" data-c="'+idxOf(r.x.c)+'"><b>'+esc(r.x.c.t)+'</b><small>'+esc(BOOK[r.x.c.tab].name)+'</small><span>'+sn+'</span></button>'}).join('')+gl.map(g=>'<button class="sr" data-a="srgl" data-t="'+esc(g[0])+'"><b>📚 '+esc(g[0])+'</b><small>Kamus · '+esc(g[2])+'</small><span>'+esc(g[1].slice(0,110))+'</span></button>').join('');
  box.hidden=false;
}
/* ---------- confetti ---------- */
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const em=['🎀','💖','⭐','✨','🌸','🍓'];
  for(let i=0;i<22;i++){const e=document.createElement('i');e.className='cf';e.textContent=em[i%em.length];e.style.left=(5+Math.random()*90)+'vw';e.style.animationDelay=(Math.random()*.4)+'s';e.style.fontSize=(16+Math.random()*16)+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
}
/* ---------- render ---------- */
function render(){
  parseHash();renderTabs();renderStats();
  const m=$('#main');let inner,after;
  if(view.tab==='beranda')inner=renderHome();
  else if(view.tab==='kamus'){inner=kamusHtml();after=()=>kamusBody()}
  else if(view.tab==='lab'){inner=labHtml();after=()=>{labInit(m);labShowMission()}}
  else if(view.tab==='kuis'){inner=kuisHtml()}

  $$('.pg',m).forEach(p=>pgRun(p,true));
  after&&after();
  window.scrollTo({top:0});
}

document.addEventListener('click',e=>{
  if(!e.target.closest('#qres,#qsearch')){const r=$('#qres');if(r)r.hidden=true}
  const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;
  if(a==='tab')setView(el.dataset.t,0);
  else if(a==='goch'){const r=$('#qres');if(r)r.hidden=true;setView(el.dataset.t,+el.dataset.c)}
  else if(a==='ln'){
    const open=el.getAttribute('aria-expanded')==='true';el.setAttribute('aria-expanded',String(!open));el.nextElementSibling.hidden=open;
    const id=el.dataset.lid;if(!open&&!S.seen[id]){S.seen[id]=1;gain(1,'baris dibaca')}
  }
  else if(a==='qo'){
    const q=el.closest('.qz');if(q.dataset.done)return;q.dataset.done='1';
    const right=+q.dataset.a,i=+el.dataset.i;
    $$('.qo',q).forEach((b,j)=>{b.disabled=true;if(j===right)b.classList.add('good');else if(j===i)b.classList.add('bad')});
    $('.why',q).hidden=false;
    if(i===right){const id=q.dataset.qid;if(!S.quiz[id]){S.quiz[id]=1;gain(5,'jawaban benar')}else toast('Benar! 🎉')}
    else toast('Belum tepat, baca penjelasannya ya');
  }
  else if(a==='pgrun')pgRun(el.closest('.pg'));
  else if(a==='pgreset'){const b=el.closest('.pg');$('textarea',b).value=PGS[b.dataset.pid].code;pgRun(b)}
  else if(a==='pglab'){const b=el.closest('.pg'),p=PGS[b.dataset.pid],code=$('textarea',b).value;S.lab=S.lab||{cur:'Proyek 1',projs:{}};
    const proj=p.js?{html:'<!doctype html>\n<html lang="id">\n<head><meta charset="utf-8"><title>Latihan</title></head>\n<body>\n  \n</body>\n</html>\n',css:'',js:code}:{html:code,css:'',js:''};
    S.lab.projs['Dari bab']=proj;S.lab.cur='Dari bab';save();setView('lab')}
  else if(a==='finish'){if(!S.done[el.dataset.id]){S.done[el.dataset.id]=1;gain(10,'bab selesai');confetti();render()}}
  else if(a==='fav'){S.fav=S.fav||{};const id=el.dataset.id;if(S.fav[id])delete S.fav[id];else S.fav[id]=1;save();el.textContent=S.fav[id]?'★ Tersimpan':'☆ Bookmark';el.setAttribute('aria-pressed',String(!!S.fav[id]))}
  else if(a==='reset'){if(el.dataset.sure){S={done:{},xp:0,seen:{},quiz:{},pg:{},theme:S.theme,skin:S.skin,lab:S.lab};save();render()}else{el.dataset.sure=1;el.textContent='Yakin? ketuk lagi';}}
  // kamus
  else if(a==='kmmode'){KM.mode=el.dataset.m;KM.tq=null;KM.flip=false;$$('.seg button').forEach(b=>b.setAttribute('aria-pressed',String(b===el)));kamusBody()}
  else if(a==='kmcat'){KM.cat=el.dataset.c;KM.card=0;KM.n=60;KM.tq=null;$$('[data-a=kmcat]').forEach(b=>b.removeAttribute('aria-current'));el.setAttribute('aria-current','true');kamusBody()}
  else if(a==='kmmore'){KM.n+=60;kamusBody()}
  else if(a==='gfav'){S.gfav=S.gfav||{};const t=el.dataset.t;if(S.gfav[t])delete S.gfav[t];else S.gfav[t]=1;save();el.textContent=S.gfav[t]?'★':'☆'}
  else if(a==='kmflip'){KM.flip=!KM.flip;kamusBody()}
  else if(a==='kmnext'||a==='kmprev'||a==='kmshuf'){const n=kmFiltered().length;KM.card=a==='kmshuf'?Math.floor(Math.random()*n):(KM.card+(a==='kmnext'?1:-1)+n)%n;KM.flip=false;kamusBody()}
  else if(a==='kmyes'||a==='kmno'){const g=kmFiltered()[KM.card];S.known=S.known||{};if(a==='kmyes'){if(!S.known[g[0]]){S.known[g[0]]=1;gain(1,'istilah hafal')}}else delete S.known[g[0]];save();KM.card=(KM.card+1)%kmFiltered().length;KM.flip=false;kamusBody()}
  else if(a==='kmpick'){const q=KM.tq;if(q.done)return;q.pick=+el.dataset.i;q.ok=q.opts[q.pick]===q.a;q.done=true;if(q.ok)gain(2,'tebakan benar');kamusBody()}
  else if(a==='kmnq'){KM.tq=null;kamusBody()}
  else if(a==='srgl'){KM.q=el.dataset.t;KM.mode='list';KM.cat='Semua';$('#qres').hidden=true;if(view.tab==='kamus')render();else setView('kamus')}
  // kuis acak
  else if(a==='kzpick'){const q=KQ.qs[KQ.i];if(KQ.answered)return;KQ.answered=true;const i=+el.dataset.i;$$('.qz .qo').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('good');else if(j===i)b.classList.add('bad')});$('.qz .why').hidden=false;if(i===q.a){KQ.score++;toast('Benar! 🎉')}}
  else if(a==='kznext'){KQ.answered=false;KQ.i++;if(KQ.i>=KQ.qs.length){KQ.done=true;const xp=KQ.score*3;gain(xp,'kuis acak');if(KQ.score>=8)confetti()}$('#main .panel').innerHTML=kuisHtml()}
  else if(a==='kzagain'){kuisNew();$('#main .panel').innerHTML=kuisHtml()}

  else if(a==='labfile')labFile(el.dataset.f);
  else if(a==='labjump'){labFile(el.dataset.f);if(+el.dataset.l>0)LB.eds[el.dataset.f].jump(+el.dataset.l)}
  else if(a==='labcopy')labCopy(labProj()[LB.file]);
  else if(a==='labclr'){$('#labCon').innerHTML=''}
  else if(a==='labnew'){let n=1;while(S.lab.projs['Proyek '+n])n++;S.lab.projs['Proyek '+n]=Object.assign({},LAB_START);S.lab.cur='Proyek '+n;save();render()}
  else if(a==='labdel'){if(!el.dataset.sure){el.dataset.sure=1;el.textContent='Yakin? ketuk lagi';return}const ks=Object.keys(S.lab.projs);delete S.lab.projs[S.lab.cur];S.lab.cur=Object.keys(S.lab.projs)[0]||'Proyek 1';save();render()}

});

<div class="stage" data-st style="--ink:#3b3585;--card:#fff;--bg:#fdeaf4"><div data-card style="background:var(--bg);color:var(--ink);border:3px solid var(--accent);border-radius:16px;padding:14px"><b style="color:var(--accent)">Kartu contoh</b><p style="margin:4px 0 8px">Semua warna di sini ambil dari variabel.</p><span style="background:var(--accent);color:#fff;padding:3px 14px;border-radius:99px;font-weight:800">Tombol</span></div></div><pre class="codeout" data-o></pre>`,
i(b){const st=$('[data-st]',b),o=$('[data-o]',b);const f=()=>{const h=$('[data-r=h]',b).value,dk=$('[data-r=dk]',b).checked;

function mkEditor(host,kind,value,onchange){
  host.innerHTML='<div class="ed-gut"><div class="ed-gi"></div></div><div class="ed-main"><div class="ed-view"><div class="ed-in"><div class="ed-bands"></div><pre class="ed-hl"></pre></div></div><textarea class="ed-ta" wrap="off" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off" aria-label="Editor '+kind+'"></textarea></div>';
  const ta=$('.ed-ta',host),pre=$('.ed-hl',host),gi=$('.ed-gi',host),inn=$('.ed-in',host),bands=$('.ed-bands',host);
  const ed={ta,kind,marks:[],busy:false};
  ta.value=value;
  ed.render=()=>{
    const v=ta.value;pre.innerHTML=hl(v,kind)+'\n';
    const n=v.split('\n').length,mk={};ed.marks.forEach(p=>{if(p.line>0&&(!mk[p.line]||p.sev==='err'))mk[p.line]=p.sev});
    let g='',b='';for(let i=1;i<=n;i++){g+='<div class="gl '+(mk[i]||'')+'">'+(mk[i]?'●':i)+'</div>';if(mk[i])b+='<div class="band '+mk[i]+'" style="top:'+(8+(i-1)*21)+'px"></div>'}
    gi.innerHTML=g;bands.innerHTML=b;ed.sync();
  };
  ed.sync=()=>{inn.style.transform='translate('+(-ta.scrollLeft)+'px,'+(-ta.scrollTop)+'px)';gi.style.transform='translateY('+(-ta.scrollTop)+'px)'};
  ed.changed=()=>{ed.render();onchange(ta.value)};
  ed.set=v=>{ta.value=v;ed.render()};
  ed.jump=line=>{const L=ta.value.split('\n');let idx=0;for(let i=0;i<line-1&&i<L.length;i++)idx+=L[i].length+1;ta.focus();ta.setSelectionRange(idx,idx+(L[line-1]||'').length);ta.scrollTop=Math.max(0,(line-3)*21)};
  ta.addEventListener('scroll',ed.sync);
  // -- edit programatis yang menjaga Ctrl+Z
  function edit(from,to,text,caret){
    ed.busy=true;ta.focus();ta.setSelectionRange(from,to);
    let ok=false;try{ok=text===''?document.execCommand('delete'):document.execCommand('insertText',false,text)}catch(e){}
    if(!ok){ta.setRangeText(text,from,to,'end')}
    const c=caret==null?from+text.length:caret;ta.setSelectionRange(c,c);ed.busy=false;ed.changed();
  }
  const lineStart=(v,p)=>v.lastIndexOf('\n',p-1)+1;
  const indentOf=(v,p)=>/^[ \t]*/.exec(v.slice(lineStart(v,p),p))[0];
  const insideTag=(v,p)=>{const a=v.lastIndexOf('<',p-1),b=v.lastIndexOf('>',p-1);return a>b};
  ta.addEventListener('beforeinput',e=>{
    if(ed.busy)return;
    const s=ta.selectionStart,en=ta.selectionEnd,v=ta.value;
    if(e.inputType==='deleteContentBackward'&&s===en&&s>0){
      const a=v[s-1],b=v[s];if(PAIR[a]&&PAIR[a]===b&&(a!=='<'||kind==='html')){e.preventDefault();edit(s-1,s+1,'',s-1)}
      return;
    }
    if(e.inputType==='insertLineBreak'||e.inputType==='insertParagraph'){
      e.preventDefault();
      const ind=indentOf(v,s),bf=v[s-1],af=v[en];
      const tail=v.slice(en);
      if((bf==='{'&&af==='}')||(bf==='['&&af===']')||(bf==='('&&af===')')||(kind==='html'&&bf==='>'&&/^<\//.test(tail))){
        const t='\n'+ind+'  \n'+ind;edit(s,en,t,s+1+ind.length+2);
      }else if(bf==='{'||bf==='('||bf==='['){edit(s,en,'\n'+ind+'  ');}
      else edit(s,en,'\n'+ind);
    }
  });
  ta.addEventListener('input',e=>{
    if(ed.busy)return;
    if(e.inputType==='insertText'&&e.data&&e.data.length===1){
      const s=ta.selectionStart,v=ta.value,ch=e.data,prev=v[s-2]||'',next=v[s]||'';
      const closer=')]}';
      if(closer.includes(ch)&&next===ch){edit(s-1,s,'',s);return}
      if(ch==='>'&&kind==='html'){
        const before=v.slice(0,s);
        const m=/<([a-zA-Z][\w-]*)(?:\s(?:"[^"]*"|'[^']*'|[^<>"'])*)?>$/.exec(before);
        const skip=next==='>';
        if(m&&!VOID_T.has(m[1].toLowerCase())&&!/\/>$/.test(before)){
          const closeTag='</'+m[1]+'>';
          if(v.slice(skip?s+1:s).startsWith(closeTag)){if(skip)edit(s-1,s+1,'>',s);return}
          edit(skip?s-1:s-1,skip?s+1:s,'>'+closeTag,s);return;
        }
        if(skip){edit(s-1,s,'',s);return}
        ed.changed();return;
      }
      if(ch==='"'||ch==="'"||ch==='`'){
        if(next===ch&&prev!==ch){edit(s-1,s,'',s);return}
        if(/\w/.test(prev)){ed.changed();return}
        if(kind==='html'&&!insideTag(v,s-1)){ed.changed();return}
        if(ch==="'"&&kind==='html'){ed.changed();return}
        if(next===''||/[\s)\]}>,;]/.test(next)){edit(s,s,ch,s);return}
        ed.changed();return;
      }
      if(ch==='('||ch==='['||ch==='{'){
        if(next===''||/[\s)\]}>,;]/.test(next)){edit(s,s,PAIR[ch],s);return}
        ed.changed();return;
      }
      if(ch==='<'&&kind==='html'){
        if(!/\w/.test(prev)&&(next===''||/[\s<]/.test(next))){edit(s,s,'>',s);return}
      }
    }
    ed.changed();
  });
  ta.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();labRun();return}
    if(e.key!=='Tab')return;
    e.preventDefault();
    const s=ta.selectionStart,en=ta.selectionEnd,v=ta.value;
    if(s===en&&!e.shiftKey&&kind==='html'){
      const ls=lineStart(v,s),word=v.slice(ls,s).trim();
      if(word==='!'){const ind=indentOf(v,s);edit(ls+indentOf(v,s).length,s,LAB_START.html.replace(/\n/g,'\n'+ind),null);return}
      const m=/^([a-z][a-z0-9]*)?((?:[.#][\w-]+)*)$/.exec(word);
      if(m&&m[1]&&HTML_TAGS.includes(m[1])){
        const cls=(m[2].match(/\.[\w-]+/g)||[]).map(x=>x.slice(1)).join(' '),id=(/#([\w-]+)/.exec(m[2])||[])[1];
        const at=(id?' id="'+id+'"':'')+(cls?' class="'+cls+'"':'');
        const start=s-word.length,open='<'+m[1]+at+'>';
        const full=VOID_T.has(m[1])?'<'+m[1]+at+'>':open+'</'+m[1]+'>';
        edit(start,s,full,start+open.length);return;
      }
    }
    if(s!==en||e.shiftKey){
      const a=lineStart(v,s);let b=en;if(v[b-1]==='\n')b--;
      const blk=v.slice(a,b),out=e.shiftKey?blk.replace(/^( {1,2}|\t)/gm,''):blk.replace(/^/gm,'  ');
      edit(a,b,out,null);ta.setSelectionRange(a,a+out.length);return;
    }
    edit(s,en,'  ');
  });
  ed.render();
  return ed;
}

function labInit(root){
  const P=labProj();
  LB.eds={};
  LAB_FILES.forEach(f=>{const host=$('[data-ed="'+f[0]+'"]',root);LB.eds[f[0]]=mkEditor(host,f[0],P[f[0]],v=>{labProj()[f[0]]=v;labSave();labLint();if(LB.live)labSchedule()})});
  labLint();labRun();
  $('#labProj',root).onchange=e=>{S.lab.cur=e.target.value;save();render()};
  $('#labName',root).onchange=e=>{const nn=e.target.value.trim()||S.lab.cur;if(nn!==S.lab.cur&&!S.lab.projs[nn]){S.lab.projs[nn]=S.lab.projs[S.lab.cur];delete S.lab.projs[S.lab.cur];S.lab.cur=nn;save();render()}};
  $('#labLive',root).onchange=e=>{LB.live=e.target.checked};
  $('#labSnip',root).onchange=e=>{const x=SNIPS[+e.target.value];e.target.value='';if(!x)return;labFile(x[1]);const ed=LB.eds[x[1]],ta=ed.ta;ta.focus();const s=ta.selectionStart;ta.setRangeText(x[2],s,ta.selectionEnd,'end');ed.changed();toast('Snippet disisipkan di '+LAB_FILES.find(f=>f[0]===x[1])[1])};
  $('#labMis',root).onchange=e=>labMission(e.target.value);
  $('#labRepl',root).onsubmit=e=>{e.preventDefault();const i=$('#labIn',root),c=i.value.trim();if(!c)return;i.value='';labLog('› '+c,'in');try{const w=$('#labFrame').contentWindow;const r=w.eval(c);labLog(r===undefined?'undefined':(typeof r==='object'?JSON.stringify(r):String(r)),'out')}catch(er){labLog('⚠ '+friendly(er.message),'err')}};
}

function labLint(){
  const P=labProj();let all=[];
  LAB_FILES.forEach(([k,n])=>{const ps=lintAny(k,P[k]).map(p=>Object.assign({file:k,fname:n},p));LB.eds[k].marks=ps.concat(LB.rt.filter(r=>r.file===k)).filter(p=>p.line>0);LB.eds[k].render();all=all.concat(ps)});
  all=all.concat(LB.rt);LB.lint=all;labProblems();
}
function labProblems(){
  const box=$('#labProb');if(!box)return;const all=LB.lint;
  const e=all.filter(p=>p.sev==='err').length,w=all.filter(p=>p.sev==='warn').length,i=all.filter(p=>p.sev==='info').length;
  $('#labCnt').textContent=all.length?'· '+(e?e+' error ':'')+(w?w+' peringatan ':'')+(i?i+' saran':''):'· aman ✓';
  LAB_FILES.forEach(([k])=>{const c=all.filter(p=>p.file===k&&p.sev==='err').length,b=$('[data-b="'+k+'"]');if(b){b.textContent=c?String(c):'';b.hidden=!c}});
  if(!all.length){box.innerHTML='<div class="pr ok">Tidak ada masalah yang terdeteksi. Mantap! 🎉</div>';return}
  const order={err:0,warn:1,info:2};
  box.innerHTML=all.slice().sort((a,b)=>order[a.sev]-order[b.sev]||a.file.localeCompare(b.file)||a.line-b.line).slice(0,40).map((p,i)=>'<button class="pr '+p.sev+'" data-a="labjump" data-f="'+p.file+'" data-l="'+p.line+'"><b>'+({err:'Error',warn:'Peringatan',info:'Saran'})[p.sev]+'</b> · '+p.fname+(p.line>0?' baris '+p.line:'')+(p.rt?' (saat dijalankan)':'')+'<br>'+esc(p.msg)+(p.hint?'<br><i>'+esc(p.hint)+'</i>':'')+'</button>').join('');
}

function labRun(){
  const P=labProj(),fr=$('#labFrame');if(!fr)return;
  if(/while\s*\(\s*(true|1)\s*\)|for\s*\(\s*;\s*;\s*\)/.test(P.js)&&!/\bbreak\b|\breturn\b/.test(P.js)){labLog('⛔ Perulangan tanpa akhir terdeteksi, kode tidak dijalankan supaya web tidak macet.','err');return}
  LB.rt=[];LB.logs=[];$('#labCon').innerHTML='';
  const css='\n<style>\n'+P.css+'\n</style>\n',tail=css+'<script>'+P.js+'<\/script>';

  if(m){pre=html.slice(0,m.index);post=html.slice(m.index)}else{pre=html;post=''}

  LB.map={jsStart:(before.match(/\n/g)||[]).length+1,jsLines:P.js.split('\n').length,htmlLines:pre.split('\n').length,cssLines:css.split('\n').length-1};

function labMsg(d){

    let file='js',line=0;const M=LB.map||{};
    if(d.l){const L=d.l;if(L>=M.jsStart&&L<M.jsStart+M.jsLines){file='js';line=L-M.jsStart+1}else if(L<=M.htmlLines){file='html';line=L}else{file='html';line=L-M.cssLines-M.jsLines+0}}
    LB.rt.push({file,fname:LAB_FILES.find(f=>f[0]===file)[1],sev:'err',line,msg:friendly(d.t),hint:'Pesan asli: '+d.t,rt:1});
    labLog('⚠ '+friendly(d.t),'err');labLint();return;
  }
  labLog((d.k==='warn'?'⚠ ':'› ')+d.t,d.k==='warn'?'warn':'');
  LB.logs.push(d.t);
}
function labMission(id){
  const box=$('#labMisBox');if(!id){box.hidden=true;LB.mis=null;return}
  const m=LABMIS.find(x=>x.id===id);LB.mis=m;
  const L=S.lab,nn='Misi: '+m.t;
  if(!L.projs[nn])L.projs[nn]={html:m.html,css:m.css,js:m.js};
  L.cur=nn;save();render();
}
function labShowMission(){
  const box=$('#labMisBox');if(!box)return;const m=LABMIS.find(x=>'Misi: '+x.t===S.lab.cur);
  if(!m){box.hidden=true;LB.mis=null;return}
  LB.mis=m;box.hidden=false;box.className='note tip';
  box.innerHTML='<span class="tag">Misi: '+esc(m.t)+'</span><p>'+m.goal+'</p><div class="row"><button class="btn s p" data-a="labcheck">Periksa misi ✓</button><button class="btn s g" data-a="labsol">Intip contoh jawaban</button><span class="res" id="labMisRes">'+(S.mis&&S.mis[m.id]?'✓ Sudah selesai':'')+'</span></div>';
}
function labCheck(){
  const m=LB.mis;if(!m)return;const res=$('#labMisRes'),fr=$('#labFrame');
  labRun();
  setTimeout(()=>{
    let ok=false;try{ok=!!m.check(fr.contentDocument,LB.logs.slice(),labProj())}catch(e){ok=false}
    if(ok){res.textContent='✓ Berhasil!';res.className='res ok';S.mis=S.mis||{};if(!S.mis[m.id]){S.mis[m.id]=1;gain(20,'misi selesai');confetti()}}
    else{res.textContent='Belum pas. Cek masalah di kanan, lalu coba lagi.';res.className='res bad'}
  },500);
}

  ['console.log(5 == "5");','Versi longgar.','Hasil [[true]]: teks "5" diam-diam diubah jadi angka.','Contoh kenapa [[==]] berbahaya.'],
  ['console.log(0 == false, "" == false, null == undefined);','Beberapa pasangan aneh.','Semuanya [[true]] dengan [[==]].','Jangan hafalkan; cukup pakai [[===]].'],

  ['otomatis (implisit)','[[+]] dengan teks menyambung; [[-]] [[*]] [[/]] mengubah ke angka','[["5" + 1]] → "51", [["5" - 1]] → 4']]),

{id:'jx3',t:'Operator lengkap',say:'Operator itu "kata kerja" kecil di JavaScript: tambah, bandingkan, putuskan. Yuk hafal pelan-pelan lewat tabel!',blocks:[
 T_(['Jenis','Operator','Contoh → hasil'],[
  ['Aritmetika','[[+ - * / % **]]','[[7 % 3]] → 1 (sisa bagi), [[2 ** 3]] → 8 (pangkat)'],
  ['Penugasan','[[= += -= *= /= %= **=]]','[[x += 5]] sama dengan [[x = x + 5]]'],
  ['Naik/turun','[[++ --]]','[[i++]] menambah 1 (nilai lama dipakai dulu)'],
  ['Perbandingan','[[=== !== < > <= >=]]','[[3 >= 3]] → true'],
  ['Logika','[[&& || !]]','[[true && false]] → false'],
  ['Nullish','[[??]]','[[null ?? "cadangan"]] → "cadangan", tapi [[0 ?? 5]] → 0'],
  ['Optional chaining','[[?.]]','[[user?.profil?.nama]] → undefined bila ada yang kosong, tidak error'],
  ['Ternary','[[kondisi ? a : b]]','[[umur >= 17 ? "boleh" : "belum"]]'],
  ['Spread / rest','[[...]]','[[[...a, ...b]]] menggabung array'],
  ['Bitwise','[[& | ^ ~ << >>]]','[[5 & 3]] → 1. Jarang dipakai; ada di game dan flag.'],
  ['Lainnya','[[typeof]], [[in]], [[instanceof]], [[delete]]','[["a" in {a:1}]] → true']]),
 H_('Operator logika bukan sekadar true/false'),
 P_('[[&&]] dan [[||]] mengembalikan <b>salah satu nilainya</b>, bukan selalu boolean. [[a || b]]: ambil [[a]] kalau truthy, kalau tidak ambil [[b]]. [[a && b]]: ambil [[a]] kalau falsy, kalau tidak ambil [[b]]. Itu sebabnya sering dipakai untuk nilai cadangan.'),
 A_('nullish.js','js',[
  ['const user = { profil: null, koin: 0 };','Kita punya data yang sebagian kosong.','Objek dengan [[profil]] kosong dan [[koin]] bernilai 0.','Situasi nyata: data dari server sering ada yang kosong.'],
  ['console.log(user.koin || 10);','Mau memberi nilai cadangan.','Hasil 10! Karena 0 itu falsy, [[||]] menggantinya padahal 0 valid.','Contoh jebakan [[||]].'],
  ['console.log(user.koin ?? 10);','Cadangan hanya untuk [[null]]/[[undefined]].','Hasil 0, nilai 0 dihormati.','[[??]] lebih tepat untuk "kalau benar-benar tidak ada".'],
  ['console.log(user.profil?.nama);','Mengakses [[nama]] dari [[null]] biasanya error.','Tanda [[?.]] berhenti dan mengembalikan [[undefined]] jika sebelumnya kosong.','Menghindari error "Cannot read properties of null".'],
  ['console.log(user.profil?.nama ?? "Tamu");','Gabungan keduanya.','Jika tidak ada nama, tampilkan "Tamu".','Pola sangat umum untuk menampilkan data opsional.']]),
 H_('Urutan prioritas (precedence)'),
 P_('Seperti matematika: [[*]] sebelum [[+]]. Urutan umum dari tinggi ke rendah: kurung [[( )]] → [[!]] [[++]] [[typeof]] → [[**]] → [[* / %]] → [[+ -]] → perbandingan → [[===]] → [[&&]] → [[||]] [[??]] → ternary → penugasan. Kalau ragu, <b>pakai kurung</b>. Kode yang jelas lebih baik daripada kode yang hafal-hafalan.'),
 G_({js:1,code:'const user = { profil: null };\n// cetak nama profil; kalau tidak ada, cetak Tamu\nconsole.log("?");\n',goal:'cetak [[Tamu]] memakai [[?.]] dan [[??]] sekaligus.',check:(d,l,c)=>l.some(x=>x.trim()==='Tamu')&&/\?\./.test(c)&&/\?\?/.test(c),sol:'const user = { profil: null };\nconsole.log(user.profil?.nama ?? "Tamu");'}),
 Z_('Berapa hasil [[0 || 7]] dan [[0 ?? 7]]?',['7 dan 7','7 dan 0','0 dan 7','0 dan 0'],1,'[[||]] menganggap 0 falsy sehingga ambil 7. [[??]] hanya mengganti null/undefined, jadi 0 tetap 0.'),
 Z_('Hasil [[2 + 3 * 4]] adalah...',['20','14','24','9'],1,'[[*]] lebih dulu: 3 * 4 = 12, lalu 2 + 12 = 14. Mau 20? Tulis [[(2 + 3) * 4]].')]},
{id:'jx4',t:'String (teks) lengkap',say:'Hampir semua yang tampil di web adalah teks. Kuasai string, kamu kuasai separuh dunia web!',blocks:[
 P_('String ditulis dengan [["…"]], [[\'…\']], atau backtick (template literal). String <b>tidak bisa diubah di tempat</b>: semua metode mengembalikan string BARU.'),
 T_(['Metode','Fungsi','Contoh → hasil'],[
  ['[[length]]','Jumlah karakter (properti, tanpa kurung)','[["halo".length]] → 4'],
  ['[[at(i)]] / [[s[i]]]','Karakter ke-i ([[at(-1)]] = terakhir)','[["halo".at(-1)]] → "o"'],
  ['[[slice(a, b)]]','Ambil potongan dari a sampai sebelum b','[["kebun".slice(1,3)]] → "eb"'],
  ['[[indexOf(x)]] / [[includes(x)]]','Posisi / ada tidaknya','[["kebun".includes("bu")]] → true'],
  ['[[startsWith]] / [[endsWith]]','Awal / akhir cocok?','[["a.png".endsWith(".png")]] → true'],
  ['[[toUpperCase()]] / [[toLowerCase()]]','Ubah huruf besar/kecil','[["Aku".toLowerCase()]] → "aku"'],
  ['[[trim()]]','Buang spasi di pinggir','[["  hai ".trim()]] → "hai"'],
  ['[[split(pemisah)]]','Pecah jadi array','[["a,b,c".split(",")]] → ["a","b","c"]'],
  ['[[replace]] / [[replaceAll]]','Ganti teks','[["a-b-c".replaceAll("-", "+")]] → "a+b+c"'],
  ['[[padStart(n, c)]]','Isi depan sampai panjang n','[["5".padStart(2,"0")]] → "05"'],
  ['[[repeat(n)]]','Ulang n kali','[["ab".repeat(3)]] → "ababab"'],
  ['[[localeCompare]]','Bandingkan untuk mengurutkan','[["a".localeCompare("b")]] → -1']]),
 H_('Template literal (backtick)'),
 A_('template.js','js',[
  ['const nama = "Aisyah", koin = 12;','Dua data yang mau digabung dalam kalimat.','Dua variabel sekaligus dengan koma.','Bahan untuk contoh.'],
  ['console.log("Halo " + nama + ", koinmu " + koin + "!");','Cara lama: menyambung dengan [[+]].','Berfungsi, tapi mudah lupa spasi dan tanda kutip.','Pembanding.'],
  ['console.log(`Halo ${nama}, koinmu ${koin * 2}!`);','Cara modern lebih rapi.','Pakai backtick; isi [[${…}]] dihitung lalu disisipkan. Boleh ekspresi, misal [[koin * 2]].','Kalimat mudah dibaca, bisa banyak baris juga.'],
  ['const baris = `satu\ndua`;','Teks banyak baris.','Backtick mengizinkan Enter di dalam teks.','Cocok untuk potongan HTML sebagai string.']]),
 H_('Unicode dan teks Arab'),
 P_('JavaScript menyimpan teks dalam unit 16-bit. Karakter biasa = 1 unit, emoji = 2 unit, dan huruf Arab dengan harakat = banyak unit karena harakat adalah karakter tersendiri. Jadi [[length]] bukan selalu "jumlah huruf yang terlihat". Untuk mencari ayat tanpa harakat, Kebun Murojaah membuang harakat dulu dengan regex rentang Unicode (lihat demo normalisasi di bab Bedah).'),
 C_('unicode.js','js','console.log("😀".length);            // 2\nconsole.log([..."😀"].length);       // 1 (iterasi per karakter)\nconsole.log("é".normalize("NFD").length); // 2 (e + aksen)\nconsole.log("بِسْمِ".length);          // 5 (huruf + harakat terhitung)'),
 G_({js:1,code:'const kata = "kebun";\n// cetak dengan huruf pertama kapital: Kebun\nconsole.log(kata);\n',goal:'cetak [[Kebun]] (huruf pertama kapital, sisanya tetap) memakai metode string.',check:(d,l)=>l.some(x=>x.trim()==='Kebun'),sol:'const kata = "kebun";\nconsole.log(kata[0].toUpperCase() + kata.slice(1));'}),
 G_({js:1,code:'const nomor = 7;\n// cetak nomor dengan 3 digit: 007\nconsole.log(nomor);\n',goal:'cetak [[007]] memakai [[padStart]].',check:(d,l)=>l.some(x=>x.trim()==='007'),sol:'const nomor = 7;\nconsole.log(String(nomor).padStart(3, "0"));'}),
 Z_('Hasil [["kebun".slice(1, 3)]] adalah...',['"ke"','"eb"','"ebu"','"keb"'],1,'[[slice]] mengambil dari indeks 1 sampai SEBELUM 3, yaitu huruf indeks 1 ("e") dan 2 ("b").'),
 Z_('Setelah [[const s = "abc"; s.toUpperCase();]] isi [[s]] adalah...',['"ABC"','"abc"','undefined','error'],1,'String itu immutable. [[toUpperCase()]] mengembalikan string baru; [[s]] tidak berubah kecuali kamu menyimpan hasilnya.')]},
{id:'jx5',t:'Number, Math & Date',say:'Angka, hitung-hitungan, dan tanggal. Ini bahan streak Kebun Murojaah, lho. Awas jebakan bulan 0!',blocks:[
 H_('Number'),
 T_(['Alat','Fungsi','Contoh → hasil'],[
  ['[[toFixed(n)]]','Bulatkan n desimal (hasil TEKS)','[[(3.14159).toFixed(2)]] → "3.14"'],
  ['[[parseInt(t, 10)]]','Ambil bilangan bulat dari teks','[[parseInt("42px", 10)]] → 42'],
  ['[[parseFloat(t)]]','Ambil desimal dari teks','[[parseFloat("3.5kg")]] → 3.5'],
  ['[[Number.isInteger(x)]]','Bulat atau bukan','[[Number.isInteger(5.0)]] → true'],
  ['[[Number.isNaN(x)]]','Cek NaN dengan benar','[[Number.isNaN("a")]] → false, [[Number.isNaN(NaN)]] → true'],
  ['[[toLocaleString("id-ID")]]','Format ribuan sesuai bahasa','[[(1234567).toLocaleString("id-ID")]] → "1.234.567"'],
  ['[[Number.MAX_SAFE_INTEGER]]','Batas bilangan bulat aman','9007199254740991 (di atasnya pakai bigint)']]),
 H_('Math'),
 T_(['Fungsi','Arti','Contoh → hasil'],[
  ['[[Math.round / floor / ceil / trunc]]','Pembulatan biasa / ke bawah / ke atas / buang desimal','[[Math.floor(4.9)]] → 4, [[Math.ceil(4.1)]] → 5'],
  ['[[Math.max / min]]','Terbesar / terkecil','[[Math.max(3, 9, 2)]] → 9, [[Math.max(...arr)]]'],
  ['[[Math.abs]]','Nilai mutlak','[[Math.abs(-5)]] → 5'],
  ['[[Math.pow]] / [[**]]','Pangkat','[[Math.pow(2, 10)]] → 1024'],
  ['[[Math.sqrt]]','Akar kuadrat','[[Math.sqrt(81)]] → 9'],
  ['[[Math.random()]]','Acak 0 sampai kurang dari 1','[[Math.floor(Math.random() * 6) + 1]] → dadu 1-6'],
  ['[[Math.PI]]','Konstanta pi','3.14159…']]),
 H_('Date: tanggal dan waktu'),
 P_('Objek [[Date]] menyimpan satu momen waktu. <b>Jebakan terbesar:</b> bulan dihitung dari <b>0</b> (Januari = 0, November = 10), tetapi tanggal dari 1. Itu sebabnya [[dstr()]] di Kebun Murojaah memakai [[getMonth() + 1]].'),
 A_('tanggal.js','js',[
  ['const d = new Date(2026, 10, 5);','Membuat tanggal tertentu.','Argumen: tahun, bulan (0-11!), tanggal. Angka 10 berarti <b>November</b>.','Pembuka contoh; banyak bug berasal dari salah bulan.'],
  ['console.log(d.getFullYear());','Ambil tahun.','Mengembalikan 2026. (Jangan pakai [[getYear]], itu usang.)','Bahan teks tanggal.'],
  ['console.log(d.getMonth() + 1);','Ambil bulan yang manusiawi.','[[getMonth()]] hasilnya 10, ditambah 1 jadi 11.','Selalu ingat +1 saat menampilkan.'],
  ['console.log(d.getDate(), d.getDay());','Tanggal dan hari dalam pekan.','[[getDate]] = 5. [[getDay]] = 0 (Minggu) sampai 6 (Sabtu).','Menentukan nama hari lewat array [[["Min","Sen",…]]].'],
  ['d.setDate(d.getDate() + 30);','Maju 30 hari.','Date otomatis menggeser bulan dan tahun jika lewat batas.','Cara aman menghitung "N hari lagi"; inti [[addDays]] di Kebun.'],
  ['console.log(new Date("2026-11-05").toISOString());','Format standar internasional.','Teks seperti 2026-11-05T00:00:00.000Z (waktu UTC).','Untuk menyimpan/mengirim waktu. Untuk tanggal lokal, bangun dari getFullYear/getMonth/getDate.'],
  ['console.log(Date.now());','Butuh angka waktu.','Jumlah milidetik sejak 1 Januari 1970 (UTC).','Dasar timer: selisih dua [[Date.now()]] = lama waktu berlalu.']]),
 N_('warn','Jebakan zona waktu','[[new Date("2026-11-05")]] (tanpa jam) dibaca sebagai UTC, sehingga di zona barat bisa tampil sebagai 4 November. Aman: [[new Date(2026, 10, 5)]] (waktu lokal) atau pecah tekslalu bangun dengan angka, seperti [[parseD]] di Kebun Murojaah.'.split('|')),
 G_({js:1,code:'const d = new Date(2026, 10, 5);\n// cetak tanggal dengan format 2026-11-05\nconsole.log(d);\n',goal:'cetak [[2026-11-05]] dengan merangkai [[getFullYear]], [[getMonth]] (+1!), dan [[getDate]] (pakai [[padStart]]).',check:(d,l)=>l.some(x=>x.trim()==='2026-11-05'),sol:'const d = new Date(2026, 10, 5);\nconst pad = n => String(n).padStart(2, "0");\nconsole.log(d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()));'}),
 Z_('[[new Date(2026, 0, 31).getMonth()]] hasilnya...',['0','1','31','2026'],0,'Januari = 0. Bulan dimulai dari 0 di JavaScript.'),
 Z_('Cara mengacak bilangan bulat 1 sampai 6?',['[[Math.random() * 6]]','[[Math.floor(Math.random() * 6) + 1]]','[[Math.round(6)]]','[[Math.random(6)]]'],1,'[[Math.random()]] menghasilkan 0 ≤ x < 1. Kali 6, bulatkan ke bawah (0-5), tambah 1 → 1-6.')]},
{id:'jx6',t:'Kondisi & perulangan lengkap',say:'Program yang hebat itu bisa <b>memutuskan</b> dan <b>mengulang</b>. Ini dua jurus yang dipakai di setiap fitur!',blocks:[
 H_('Kondisi: if, else if, else, switch'),
 A_('kondisi.js','js',[
  ['const skor = 82;','Data yang akan dinilai.','Menyimpan angka 82.','Bahan keputusan.'],
  ['if (skor >= 90) {','Cek kondisi paling istimewa lebih dulu.','Kalau benar, blok ini jalan dan sisanya dilewati.','Urutan penting: dari syarat paling ketat ke longgar.'],
  ['  console.log("A");'],
  ['} else if (skor >= 75) {','Syarat kedua hanya dicek bila yang pertama salah.','Rantai keputusan bertingkat.','Menghindari banyak [[if]] terpisah yang bisa sama-sama benar.'],
  ['  console.log("B");'],
  ['} else {','Jaring pengaman jika semua salah.','Blok cadangan.','Setiap kemungkinan tertangani.'],
  ['  console.log("C");'],['}'],
  ['switch (new Date().getDay()) {','Satu nilai dibandingkan dengan banyak pilihan pasti.','Mengecek hari dalam pekan dengan [[===]].','Lebih rapi daripada rantai if panjang untuk nilai tetap.'],
  ['  case 5: console.log("Jumat berkah"); break;','Satu pilihan.','Jika harinya 5. [[break]] menghentikan; tanpa [[break]] jatuh ke case berikutnya (fall-through).','Lupa [[break]] adalah bug klasik.'],
  ['  default: console.log("Hari biasa");','Bila tak ada yang cocok.','Cadangan seperti [[else]].','Selalu ada jawaban.'],
  ['}']]),
 H_('Perulangan'),
 T_(['Jenis','Bentuk','Pakai untuk'],[
  ['[[for]]','[[for (let i = 0; i < n; i++) { … }]]','Jumlah putaran diketahui'],
  ['[[while]]','[[while (kondisi) { … }]]','Ulangi selama kondisi benar'],
  ['[[do…while]]','[[do { … } while (kondisi)]]','Minimal sekali jalan'],
  ['[[for…of]]','[[for (const x of array) { … }]]','Isi array/string (nilai)'],
  ['[[for…in]]','[[for (const k in objek) { … }]]','Kunci objek (hindari untuk array)'],
  ['[[forEach]]','[[arr.forEach((x, i) => { … })]]','Array, tanpa [[break]]']]),
 A_('loop.js','js',[
  ['for (const s of ["Fatihah", "Ikhlas", "Falaq"]) {','Mau memproses tiap isi daftar tanpa mengurus indeks.','[[for…of]] mengambil isi satu per satu ke variabel [[s]].','Cara paling bersih mengulang array.'],
  ['  if (s === "Ikhlas") continue;','Ada satu yang mau dilewati.','[[continue]] melompat ke putaran berikutnya.','Menyaring tanpa menambah tingkat kurung.'],
  ['  console.log(s);'],['}'],
  ['let n = 0;'],
  ['while (true) {','Perulangan tanpa jumlah pasti.','Selalu benar, jadi tak berhenti sendiri!','Harus ada jalan keluar di dalamnya.'],
  ['  n++; if (n > 3) break;','Jalan keluar.','[[break]] menghentikan seluruh perulangan.','Tanpa ini browser macet (infinite loop).'],
  ['}'],
  ['luar: for (let i = 0; i < 3; i++) {  for (let j = 0; j < 3; j++) { if (j === 1) continue luar; } }','Dua perulangan bersarang, ingin langsung lanjut putaran luar.','Label [[luar:]] memberi nama; [[continue luar]] melompat ke putaran luar berikutnya.','Jarang dipakai, tapi bagus diketahui.']]),
 N_('warn','Infinite loop','Perulangan yang kondisinya tak pernah salah akan membekukan tab. Pastikan variabel penghitung berubah ke arah kondisi berhenti. Kalau halaman macet, tutup tab dan periksa kondisimu.'.split('|')),
 G_({js:1,code:'for (let i = 1; i <= 15; i++) {\n  console.log(i);\n}\n',goal:'FizzBuzz: kelipatan 3 cetak [[Fizz]], kelipatan 5 cetak [[Buzz]], kelipatan keduanya [[FizzBuzz]], selain itu cetak angkanya (1 sampai 15).',check:(d,l)=>l.length===15&&l[0]==='1'&&l[2]==='Fizz'&&l[4]==='Buzz'&&l[14]==='FizzBuzz'&&l[7]==='8',sol:'for (let i = 1; i <= 15; i++) {\n  if (i % 15 === 0) console.log("FizzBuzz");\n  else if (i % 3 === 0) console.log("Fizz");\n  else if (i % 5 === 0) console.log("Buzz");\n  else console.log(i);\n}'}),
 Z_('Apa fungsi [[break]] di dalam [[switch]]?',['Mengulang case','Menghentikan switch agar tidak jatuh ke case berikutnya','Menghapus variabel','Mengakhiri program'],1,'Tanpa [[break]], eksekusi lanjut ke case di bawahnya (fall-through).'),
 Z_('Untuk mengulang isi array, cara paling pas adalah...',['[[for…in]]','[[for…of]]','[[while(true)]]','[[do…while]]'],1,'[[for…of]] mengambil nilai langsung. [[for…in]] mengambil kunci (indeks sebagai teks) dan bisa ikut kunci tak terduga.')]},
{id:'jx7',t:'Fungsi mendalam & closure',say:'Fungsi itu "resep" yang bisa dipakai berulang. Dan ada trik keren bernama <b>closure</b> yang bikin fungsi punya ingatan!',blocks:[
 T_(['Bentuk','Contoh','Catatan'],[
  ['Deklarasi','[[function tambah(a, b) { return a + b }]]','Di-hoist: boleh dipanggil sebelum ditulis'],
  ['Ekspresi','[[const tambah = function (a, b) { … }]]','Tidak di-hoist'],
  ['Arrow','[[const tambah = (a, b) => a + b]]','Ringkas; tidak punya [[this]] sendiri'],
  ['Parameter default','[[function f(x = 10) { … }]]','Dipakai bila argumen kosong/undefined'],
  ['Rest','[[function f(...angka) { … }]]','Mengumpulkan sisa argumen jadi array'],
  ['Destructuring parameter','[[function f({ nama, umur }) { … }]]','Langsung membongkar objek'],
  ['IIFE','[[(() => { … })()]]','Dijalankan seketika; membuat scope pribadi']]),
 H_('Scope, hoisting, dan closure'),
 P_('<b>Scope</b> = daerah di mana sebuah variabel terlihat. [[let]] dan [[const]] hanya hidup di dalam blok [[{ }]]-nya. [[var]] (cara lama) hidup di seluruh fungsi dan sering membuat bug, jadi hindari. <b>Closure</b>: fungsi yang "membawa" variabel dari tempat ia dibuat, walau tempat itu sudah selesai dijalankan.'),
 A_('closure.js','js',[
  ['function buatPenghitung() {','Kita ingin penghitung yang punya ingatan sendiri.','Fungsi pabrik: tiap dipanggil menghasilkan penghitung baru.','Dasar pola modul dan state privat.'],
  ['  let n = 0;','Variabel ini harus tersembunyi dari luar.','[[n]] hidup di dalam fungsi pabrik; tak ada yang bisa mengubahnya langsung.','Enkapsulasi: data terlindungi.'],
  ['  return () => ++n;','Mengembalikan fungsi kecil.','Fungsi ini "mengingat" [[n]] walau [[buatPenghitung]] sudah selesai. Itulah <b>closure</b>.','Tiap panggilan menaikkan [[n]] dan mengembalikannya.'],
  ['}'],
  ['const a = buatPenghitung(), b = buatPenghitung();','Dua penghitung terpisah.','Masing-masing punya [[n]] sendiri.','Bukti tiap closure punya salinan sendiri.'],
  ['console.log(a(), a(), b());','Memakai keduanya.','Hasil: 1 2 1. [[a]] naik dua kali, [[b]] baru sekali.','Memastikan ingatan terpisah.']]),
 H_('Fungsi tingkat tinggi dan callback'),
 P_('Fungsi adalah nilai biasa: bisa disimpan di variabel, dikirim ke fungsi lain (<b>callback</b>), dan dikembalikan. Fungsi yang menerima/mengembalikan fungsi disebut <b>higher-order function</b>. Contoh: [[map]], [[filter]], [[addEventListener]].'),
 C_('rekursi.js','js','function faktorial(n) {\n  if (n <= 1) return 1;          // kasus dasar: HARUS ada untuk berhenti\n  return n * faktorial(n - 1);    // fungsi memanggil dirinya sendiri\n}\nconsole.log(faktorial(5)); // 120'),
 N_('tip','Rekursi','Rekursi = fungsi memanggil dirinya. Wajib punya <b>kasus dasar</b> (kapan berhenti), kalau tidak kamu kena "Maximum call stack size exceeded". Banyak masalah rekursif bisa juga ditulis dengan perulangan.'.split('|')),
 G_({js:1,code:'function buatPenghitung() {\n  // tulis di sini\n}\nconst hitung = buatPenghitung();\nconsole.log(hitung());\nconsole.log(hitung());\nconsole.log(hitung());\n',goal:'lengkapi [[buatPenghitung]] dengan closure supaya tercetak [[1]], [[2]], [[3]].',check:(d,l)=>l.length>=3&&l[0]==='1'&&l[1]==='2'&&l[2]==='3',sol:'function buatPenghitung() {\n  let n = 0;\n  return () => ++n;\n}\nconst hitung = buatPenghitung();\nconsole.log(hitung());\nconsole.log(hitung());\nconsole.log(hitung());'}),
 Z_('Apa yang dimaksud closure?',['Fungsi yang menutup browser','Fungsi yang mengingat variabel dari tempat ia dibuat','Fungsi tanpa nama','Fungsi yang dipanggil sekali'],1,'Closure membuat fungsi tetap bisa memakai variabel luar walau fungsi luar sudah selesai.'),
 Z_('Fungsi yang dipasang ke [[addEventListener]] disebut...',['Constructor','Callback','Prototype','Hoist'],1,'Fungsi yang diberikan untuk dipanggil nanti oleh fungsi lain disebut callback.')]},
{id:'jx8',t:'Array lengkap',say:'Array itu rak berlaci. Dengan metode yang pas, mengolah ratusan data jadi sekali ketik!',blocks:[
 T_(['Metode','Fungsi','Mengubah aslinya?'],[
  ['[[push(x)]] / [[pop()]]','Tambah / ambil di ujung belakang','Ya'],
  ['[[unshift(x)]] / [[shift()]]','Tambah / ambil di depan','Ya'],
  ['[[splice(i, n, …)]]','Hapus/sisip di posisi i','Ya'],
  ['[[slice(a, b)]]','Salin potongan','Tidak'],
  ['[[concat]] / [[[...a, ...b]]]','Gabung array','Tidak'],
  ['[[indexOf]] / [[includes]]','Cari posisi / ada tidaknya','Tidak'],
  ['[[find]] / [[findIndex]]','Cari elemen pertama yang cocok','Tidak'],
  ['[[filter(fn)]]','Ambil yang lolos syarat','Tidak'],
  ['[[map(fn)]]','Ubah tiap elemen','Tidak'],
  ['[[reduce(fn, awal)]]','Ringkas jadi satu nilai','Tidak'],
  ['[[some]] / [[every]]','Ada yang / semua cocok?','Tidak'],
  ['[[sort(fn)]] / [[reverse()]]','Urutkan / balik','Ya!'],
  ['[[flat]] / [[flatMap]]','Ratakan array bersarang','Tidak'],
  ['[[join(pemisah)]]','Jadi satu teks','Tidak'],
  ['[[Array.from(x)]]','Buat array dari NodeList/teks/iterable','Tidak']]),
 H_('map, filter, reduce: tiga serangkai'),
 A_('olah.js','js',[
  ['const sesi = [{ s: "Mulk", m: 12 }, { s: "Yasin", m: 20 }, { s: "Kahf", m: 35 }];','Data riwayat murojaah.','Array berisi objek (surah, menit).','Bentuk data yang mirip [[S.sessions]] di Kebun.'],
  ['const total = sesi.reduce((jml, x) => jml + x.m, 0);','Ingin total menit.','[[reduce]]: [[jml]] = penampung, mulai dari 0; tiap elemen menambah [[x.m]].','Hasil: 67. Ringkasan banyak data jadi satu angka.'],
  ['const panjang = sesi.filter(x => x.m >= 20);','Ingin sesi yang panjang saja.','[[filter]] menyimpan elemen yang fungsinya bernilai true.','Hasil: 2 elemen. Array asli tak berubah.'],
  ['const nama = sesi.map(x => x.s);','Ingin daftar nama surah saja.','[[map]] mengubah tiap elemen jadi sesuatu yang baru.','Hasil: ["Mulk","Yasin","Kahf"], panjang sama dengan aslinya.'],
  ['const urut = [...sesi].sort((a, b) => b.m - a.m);','Urutkan dari yang terlama.','[[sort]] mengubah array aslinya, jadi salin dulu dengan [[[...sesi]]].','Fungsi pembanding: negatif = a dulu, positif = b dulu.'],
  ['console.log(total, panjang.length, nama.join(", "), urut[0].s);','Lihat semua hasilnya.','Mencetak: 67 2 Mulk, Yasin, Kahf Kahf','Verifikasi.']]),
 H_('Destructuring, spread, dan salinan'),
 C_('salin.js','js','const [pertama, , ketiga] = ["a", "b", "c"];   // destructuring: pertama="a", ketiga="c"\nconst a = [1, 2, 3];\nconst b = a;           // BUKAN salinan! b dan a menunjuk array yang sama\nb.push(4);\nconsole.log(a);        // [1, 2, 3, 4]\nconst c = [...a];      // salinan dangkal (shallow copy)\nconst d = structuredClone(a); // salinan dalam\nconsole.log([...a, ...c].length);'),
 N_('warn','Array disalin dengan referensi','[[const b = a]] tidak menyalin isi; keduanya menunjuk ke satu array. Mengubah [[b]] mengubah [[a]]. Untuk salinan, pakai [[[...a]]] atau [[a.slice()]]; untuk objek bersarang pakai [[structuredClone]].'.split('|')),
 G_({js:1,code:'const siswa = [\n  { nama: "Ani", nilai: 80 },\n  { nama: "Budi", nilai: 60 },\n  { nama: "Cici", nilai: 90 }\n];\n// cetak nama yang nilainya >= 75, dipisah koma: Ani, Cici\n',goal:'cetak [[Ani, Cici]] memakai [[filter]], [[map]], dan [[join]].',check:(d,l)=>l.some(x=>x.trim()==='Ani, Cici'),sol:'const siswa = [\n  { nama: "Ani", nilai: 80 },\n  { nama: "Budi", nilai: 60 },\n  { nama: "Cici", nilai: 90 }\n];\nconsole.log(siswa.filter(s => s.nilai >= 75).map(s => s.nama).join(", "));'}),
 Z_('Apa hasil [[[1, 2, 3].map(x => x * 2)]]?',['[2, 4, 6]','6','[1, 2, 3]','[2, 3]'],0,'[[map]] menghasilkan array baru berisi hasil fungsi untuk tiap elemen.'),
 Z_('Metode mana yang MENGUBAH array aslinya?',['[[map]]','[[filter]]','[[sort]]','[[slice]]'],2,'[[sort]], [[reverse]], [[splice]], [[push]], [[pop]] mengubah array asli. Salin dulu dengan [[[...arr]]] bila perlu.')]},
{id:'jx9',t:'Objek mendalam & JSON',say:'Objek = lemari berlabel. Hampir semua data di Kebun Murojaah, bahkan seluruh state <b>S</b>, adalah objek!',blocks:[
 A_('objek.js','js',[
  ['const sesi = { surah: "Al-Mulk", menit: 12, selesai: true };','Satu sesi punya beberapa sifat.','Objek literal: pasangan [[kunci: nilai]] dipisah koma.','Cara paling umum membuat objek.'],
  ['console.log(sesi.surah, sesi["menit"]);','Dua cara membaca.','Titik untuk nama biasa; kurung siku untuk nama dari variabel atau yang berspasi.','[[sesi[nama]]] baru bisa jika [[nama]] adalah variabel.'],
  ['const kunci = "koin"; const dompet = { [kunci]: 50 };','Nama properti ditentukan saat program jalan.','Kurung siku di sisi kiri = kunci dinamis.','Berguna untuk peta data seperti [[ACT]] atau [[dayMap]].'],
  ['sesi.catatan = "lancar"; delete sesi.selesai;','Mengubah isi.','Menambah properti baru, lalu menghapus satu.','Objek bersifat mudah diubah (mutable), bahkan jika [[const]].'],
  ['const { surah, menit = 0 } = sesi;','Mau mengambil beberapa properti ke variabel.','Destructuring: buat variabel [[surah]] dan [[menit]] (default 0).','Kode lebih pendek daripada [[sesi.surah]] berulang.'],
  ['const baru = { ...sesi, menit: 15 };','Mau salinan dengan satu perubahan.','Spread menyalin semua properti, lalu [[menit]] ditimpa.','Pola ubah-tanpa-merusak yang populer.'],
  ['console.log(Object.entries(sesi));','Mau mengulang pasangan kunci-nilai.','Menghasilkan array pasangan kunci dan nilai.','Dipakai dengan [[for…of]] atau [[map]].']]),
 T_(['Alat','Fungsi','Contoh'],[
  ['[[Object.keys(o)]]','Daftar kunci','[[Object.keys({a:1,b:2})]] → ["a","b"]'],
  ['[[Object.values(o)]]','Daftar nilai','→ [1,2]'],
  ['[[Object.entries(o)]]','Daftar pasangan','→ [["a",1],["b",2]]'],
  ['[[Object.fromEntries(arr)]]','Pasangan jadi objek','kebalikan entries'],
  ['[[Object.assign(t, s)]]','Salin properti ke target','Gabung objek'],
  ['[[Object.freeze(o)]]','Kunci agar tak bisa diubah','Konstanta sungguhan (dangkal)'],
  ['[[in]] / [[hasOwnProperty]]','Cek ada kunci','[["a" in o]] → true'],
  ['[[structuredClone(o)]]','Salinan dalam','Objek bersarang ikut tersalin']]),
 H_('JSON: objek yang bisa dikirim'),
 P_('JSON adalah <b>teks</b> berformat mirip objek JavaScript, tapi aturannya ketat: kunci wajib pakai tanda kutip ganda, tidak boleh fungsi atau [[undefined]]. [[JSON.stringify(o)]] mengubah objek jadi teks; [[JSON.parse(t)]] membaliknya. Inilah cara [[save()]] menyimpan [[S]] ke localStorage.'),
 C_('json.js','js','const o = { nama: "Aisyah", koin: 12, lencana: ["rajin"] };\nconst teks = JSON.stringify(o);\nconsole.log(teks);                     // {"nama":"Aisyah","koin":12,"lencana":["rajin"]}\nconsole.log(JSON.parse(teks).koin);   // 12\nconsole.log(JSON.stringify(o, null, 2)); // versi rapi 2 spasi'),
 G_({js:1,code:'const p = { q: "kebun", hal: 2 };\n// cetak: q=kebun&hal=2\nconsole.log(p);\n',goal:'ubah objek jadi query string [[q=kebun&hal=2]] dengan [[Object.entries]], [[map]], dan [[join]].',check:(d,l)=>l.some(x=>x.trim()==='q=kebun&hal=2'),sol:'const p = { q: "kebun", hal: 2 };\nconsole.log(Object.entries(p).map(([k, v]) => k + "=" + v).join("&"));'}),
 Z_('Kenapa [[const o = {a:1}; o.a = 2;]] tidak error?',['Karena const hanya melarang mengisi ulang variabel, bukan mengubah isi objek','Karena JavaScript tak peduli const','Karena objek otomatis disalin','Karena a bukan properti'],0,'[[const]] mengunci "penunjuk" ke objek, bukan isi objeknya. Pakai [[Object.freeze]] untuk mengunci isi.'),
 Z_('Mana JSON yang VALID?',['[[{nama: "Ani"}]]','[[{"nama": "Ani"}]]','[[{\'nama\': \'Ani\'}]]','[[{"nama": undefined}]]'],1,'JSON mewajibkan kunci dan teks memakai tanda kutip ganda, dan tidak mengenal undefined.')]},
{id:'jx10',t:'Class, OOP & this',say:'Class itu "cetakan kue": satu cetakan, banyak kue. Tapi hati-hati sama <b>this</b>, dia suka berubah arti!',blocks:[
 A_('class.js','js',[
  ['class Hewan {','Kita butuh cetakan untuk banyak objek serupa.','Mendefinisikan class bernama [[Hewan]].','Dasar pemrograman berorientasi objek (OOP).'],
  ['  #energi = 10;','Sebagian data tak boleh diubah bebas dari luar.','Awalan [[#]] membuat properti <b>privat</b>; hanya bisa dipakai di dalam class.','Enkapsulasi: melindungi data.'],
  ['  constructor(nama) { this.nama = nama; }','Tiap hewan butuh nama saat dibuat.','Dijalankan otomatis oleh [[new]]. [[this]] = objek yang sedang dibuat.','Menyiapkan data awal.'],
  ['  bicara() { return this.nama + ": ..."; }','Perilaku (method) hewan.','Fungsi milik objek, dipakai lewat [[hewan.bicara()]].','Semua objek berbagi satu definisi method (hemat memori).'],
  ['  get energi() { return this.#energi; }','Mau dibaca tapi tak diubah.','<b>Getter</b>: diakses seperti properti, [[h.energi]], tanpa kurung.','Mengontrol akses.'],
  ['  static buat(nama) { return new Hewan(nama); }','Fungsi bantu milik class, bukan objek.','Method [[static]] dipanggil lewat [[Hewan.buat("x")]].','Pola "factory".'],
  ['}'],
  ['class Kucing extends Hewan {','Kucing adalah jenis hewan khusus.','[[extends]] mewarisi semua milik [[Hewan]].','Menggunakan ulang kode (pewarisan).'],
  ['  bicara() { return super.bicara() + " meong"; }','Mau menambah, bukan mengganti total.','[[super]] memanggil versi induk.','Menimpa (override) sekaligus memakai ulang.'],
  ['}'],
  ['console.log(new Kucing("Mimi").bicara());','Menjalankan.','Mencetak "Mimi: ... meong".','Bukti pewarisan bekerja.']]),
 H_('this dan jebakannya'),
 P_('[[this]] ditentukan oleh <b>cara fungsi dipanggil</b>, bukan di mana ia ditulis (kecuali arrow function, yang meminjam [[this]] dari sekitarnya). Itu sebabnya method yang dilepas dari objeknya "kehilangan" [[this]].'),
 T_(['Cara panggil','Nilai [[this]]'],[
  ['[[obj.metode()]]','[[obj]]'],
  ['[[fungsi()]] biasa','[[undefined]] (strict) / [[window]] (non-strict)'],
  ['[[new Kelas()]]','objek baru yang dibuat'],
  ['[[fn.call(x, …)]] / [[fn.apply(x, [...])]]','[[x]] (langsung)'],
  ['[[fn.bind(x)]]','fungsi baru yang [[this]]-nya terkunci ke [[x]]'],
  ['arrow function [[() => …]]','[[this]] dari kode sekitar (tidak punya sendiri)'],
  ['handler [[addEventListener]] (function biasa)','elemen yang diklik ([[e.currentTarget]])']]),
 C_('this.js','js','const timer = {\n  detik: 0,\n  mulai() {\n    // arrow function meminjam this dari mulai(), jadi this = timer\n    setInterval(() => { this.detik++; }, 1000);\n  }\n};\nconst lepas = timer.mulai;\n// lepas();  // ERROR: this bukan lagi timer\nconst aman = timer.mulai.bind(timer); // kunci this ke timer'),
 N_('tip','Prototype sekilas','Di balik layar, class memakai <b>prototype</b>: setiap objek punya "tautan" ke objek lain yang menyimpan method bersama. Jadi kalau method tidak ada di objek, JavaScript mencarinya ke atas rantai prototype. Class adalah penulisan yang lebih rapi untuk mekanisme ini.'.split('|')),
 G_({js:1,code:'class Hewan {\n  constructor(nama) { this.nama = nama; }\n  bicara() { return this.nama + ": ..."; }\n}\n// buat class Kucing yang extends Hewan dan menimpa bicara()\n// supaya mengembalikan nama + ": meong"\n\nconsole.log(new Hewan("Rex").bicara());\n',goal:'buat [[Kucing]] ([[extends Hewan]]) dengan [[bicara()]] yang mengembalikan [[nama: meong]], lalu cetak [[new Kucing("Mimi").bicara()]] → [[Mimi: meong]].',check:(d,l,c)=>l.some(x=>x.trim()==='Mimi: meong')&&/extends/.test(c),sol:'class Hewan {\n  constructor(nama) { this.nama = nama; }\n  bicara() { return this.nama + ": ..."; }\n}\nclass Kucing extends Hewan {\n  bicara() { return this.nama + ": meong"; }\n}\nconsole.log(new Hewan("Rex").bicara());\nconsole.log(new Kucing("Mimi").bicara());'}),
 Z_('Properti [[#energi]] di dalam class artinya...',['Konstanta','Privat: hanya bisa diakses dari dalam class','Statis','Warisan'],1,'Awalan [[#]] membuat anggota privat; mengaksesnya dari luar menyebabkan SyntaxError.'),
 Z_('Method dilepas: [[const f = obj.metode; f()]]. Kenapa [[this]] hilang?',['Karena f lebih cepat','Karena [[this]] ditentukan saat dipanggil, dan [[f()]] bukan lagi [[obj.metode()]]','Karena const','Karena JavaScript bug'],1,'Gunakan [[bind]], arrow function, atau panggil lewat objeknya untuk menjaga [[this]].')]}
);
