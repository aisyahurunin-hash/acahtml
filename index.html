const TOKEN_INFO=[['bg','Latar halaman paling luar (di belakang bingkai)'],['arg','Warna pola latar (argyle/garis/titik)'],['dots','Titik kecil pelengkap latar'],['frame','Latar bingkai utama (hampir putih bernuansa tema)'],['paper','Kertas putih: kartu, panel, tombol'],['panel','Latar belakang area isi (di balik kartu putih)'],['stA','Garis belang header (lebih gelap)'],['stB','Garis belang header (lebih terang)'],['ink','Warna teks utama'],['ink2','Teks sekunder'],['line','Warna garis bingkai & outline'],['pink','Aksen dekoratif (garis putus-putus, bunga)'],['pink2','Aksen untuk teks judul'],['pinkbtn','Warna tombol utama (cukup gelap untuk teks putih)'],['pinkbg','Latar lembut aksen (pita, pil)'],['pinkbg2','Latar aksen paling muda (balon ucapan)'],['lav','Latar lembut utama (chip, pil)'],['lav2','Garis lembut & renda'],['blue','Latar biru muda (tab ketiga)'],['blue2','Teks/garis biru'],['codebg','Latar blok kode'],['code','Teks kode'],['codebar','Header blok kode'],['ok','Benar / berhasil'],['bad','Salah / error'],['warn','Peringatan']];
function rgb2hex(s){const m=/rgba?\((\d+)[ ,]+(\d+)[ ,]+(\d+)/.exec(s);if(!m)return s;return '#'+[m[1],m[2],m[3]].map(x=>(+x).toString(16).padStart(2,'0')).join('').toUpperCase()}
function hsl2hex(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return '#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('').toUpperCase()}
DEMOS.palet={t:'Palet warna tema yang sedang aktif',h:'<p style="margin:0">Ketuk kotak warna untuk menyalin kode hex. Ganti tema di tab <b>Tema</b>, lalu tekan Segarkan.</p><div class="row"><button class="btn s p" data-r>Segarkan</button></div><div class="pal" data-g></div>',
 i(b){const g=$('[data-g]',b);const f=()=>{g.innerHTML=TOKEN_INFO.map(t=>{const hx=rgb2hex(tokenRGB(t[0]));return '<button class="pal-i" data-hx="'+hx+'" title="Salin '+hx+'"><i style="background:var(--'+t[0]+')"></i><b>--'+t[0]+'</b><code>'+hx+'</code><small>'+esc(t[1])+'</small></button>'}).join('')};
  b.addEventListener('click',e=>{if(e.target.closest('[data-r]'))f();const x=e.target.closest('[data-hx]');if(x)labCopy(x.dataset.hx)});setTimeout(f,60)}};
DEMOS.palgen={t:'Pembuat palet dari satu warna dasar',h:'<div class="ctl"><label>Corak (hue) <input type="range" min="0" max="360" value="255" data-h></label><label>Aturan <select data-m><option value="analog">Analog (bertetangga)</option><option value="komp">Komplementer</option><option value="triad">Triadik</option><option value="split">Split-komplementer</option><option value="mono">Monokrom (terang-gelap)</option></select></label></div><div class="pal" data-g></div><pre class="codeout" data-o></pre>',
 i(b){const f=()=>{const h=+$('[data-h]',b).value,m=$('[data-m]',b).value;let c;
  if(m==='analog')c=[[h-30,60,70],[h-15,65,62],[h,70,55],[h+15,65,62],[h+30,60,70]];
  else if(m==='komp')c=[[h,70,55],[h,70,80],[h+180,70,55],[h+180,70,80],[h,30,95]];
  else if(m==='triad')c=[[h,70,55],[h+120,70,55],[h+240,70,55],[h,60,85],[h+120,60,85]];
  else if(m==='split')c=[[h,70,55],[h+150,70,55],[h+210,70,55],[h,60,88],[h,25,96]];
  else c=[[h,70,25],[h,65,40],[h,65,55],[h,70,75],[h,80,92]];
  const hx=c.map(x=>hsl2hex(((x[0]%360)+360)%360,x[1],x[2]));
  $('[data-g]',b).innerHTML=hx.map((x,i)=>'<button class="pal-i" data-hx="'+x+'"><i style="background:'+x+'"></i><b>Warna '+(i+1)+'</b><code>'+x+'</code><small>hsl('+(((c[i][0]%360)+360)%360)+' '+c[i][1]+'% '+c[i][2]+'%)</small></button>').join('');
  $('[data-o]',b).textContent=':root{\n'+hx.map((x,i)=>'  --w'+(i+1)+': '+x+';').join('\n')+'\n}'};
  b.addEventListener('input',f);b.addEventListener('click',e=>{const x=e.target.closest('[data-hx]');if(x)labCopy(x.dataset.hx)});f()}};
DEMOS.pola={t:'Generator pola latar',h:'<div class="ctl"><label>Pola <select data-k><option>polka</option><option>gingham</option><option>argyle</option><option>stripes</option><option>check</option><option>hearts</option><option>stars</option><option>flowers</option><option>leaves</option><option>clouds</option><option>waves</option><option>knit</option></select></label><label>Warna <input type="color" data-c value="#c9bdf5"></label><label>Latar <input type="color" data-b value="#fdeaf4"></label></div><div class="stage" data-st style="min-height:150px;border-radius:16px"></div><pre class="codeout" data-o style="white-space:pre-wrap"></pre>',
 i(b){const f=()=>{const k=$('[data-k]',b).value,c=$('[data-c]',b).value,bg=$('[data-b]',b).value;let [img,sz]=patternFor(k,k==='polka'||k==='gingham'?'color-mix(in srgb,'+c+' 70%,transparent)':c,c);
  const st=$('[data-st]',b);st.style.backgroundColor=bg;st.style.backgroundImage=img;st.style.backgroundSize=sz;st.style.backgroundPosition='';
  let css='background-color: '+bg+';\nbackground-image: '+(img.length>140?img.slice(0,120)+'…")':img)+';\nbackground-size: '+sz+';';
  if(k==='polka'){st.style.backgroundImage=img+','+img;st.style.backgroundSize=sz+','+sz;st.style.backgroundPosition='0 0,20px 20px';css='background-image: radial-gradient(c 4px, transparent 4.5px),\n                  radial-gradient(c 4px, transparent 4.5px);\nbackground-size: 40px 40px;\nbackground-position: 0 0, 20px 20px;  /* titik kedua digeser setengah */'}
  $('[data-o]',b).textContent=css};b.addEventListener('input',f);f()}};
DEMOS.bentuk={t:'Bentuk gemes: sudut, garis, bayangan',h:'<div class="ctl"><label>Sudut <input type="range" min="0" max="60" value="20" data-r></label><label>Tebal garis <input type="range" min="0" max="8" value="3" data-w></label><label>Gaya <select data-s><option>dashed</option><option>solid</option><option>dotted</option><option>double</option></select></label><label>Bayangan keras <input type="range" min="0" max="12" value="4" data-y></label></div><div class="stage" style="display:grid;place-items:center"><div data-k style="width:70%;min-height:90px;display:grid;place-items:center;background:var(--paper);font-weight:800"></div></div><pre class="codeout" data-o></pre>',
 i(b){const f=()=>{const r=$('[data-r]',b).value,w=$('[data-w]',b).value,s=$('[data-s]',b).value,y=$('[data-y]',b).value,k=$('[data-k]',b);k.style.borderRadius=r+'px';k.style.border=w+'px '+s+' var(--pink)';k.style.boxShadow='0 '+y+'px 0 var(--pink)';k.textContent='Kartu gemes';
  $('[data-o]',b).textContent='.kartu{\n  border-radius: '+r+'px;\n  border: '+w+'px '+s+' var(--pink);\n  box-shadow: 0 '+y+'px 0 var(--pink); /* blur 0 = bayangan keras seperti stiker */\n}'};b.addEventListener('input',f);f()}};
DEMOS.renda={t:'Tepi renda (scallop)',h:'<div class="ctl"><label>Jari-jari <input type="range" min="4" max="16" value="10" data-r></label><label>Jarak <input type="range" min="14" max="40" value="24" data-p></label></div><div style="background:var(--pinkbg);padding-top:0;border-radius:12px;overflow:hidden"><div data-l style="height:18px"></div><div style="padding:14px;text-align:center;font-weight:800">Seperti tepi header web ini</div></div><pre class="codeout" data-o></pre>',
 i(b){const f=()=>{const r=+$('[data-r]',b).value,p=+$('[data-p]',b).value,l=$('[data-l]',b);const bg='radial-gradient(circle at '+p/2+'px 0, var(--paper) 0 '+r+'px, transparent '+(r+1)+'px) 0 0/'+p+'px 18px repeat-x';l.style.background=bg;
  $('[data-o]',b).textContent='.tepi{\n  height: 18px;\n  background: radial-gradient(circle at '+p/2+'px 0, putih 0 '+r+'px, transparent '+(r+1)+'px)\n              0 0 / '+p+'px 18px repeat-x;\n}\n/* lingkaran setengah di tepi atas diulang ke kanan = tepi bergelombang */'};b.addEventListener('input',f);f()}};
DEMOS.svgp={t:'Edit path SVG langsung',h:'<div class="ctl"><label>Isi path (d) <input type="text" data-d size="38" value="M60 35C42 8 8 4 8 30s32 28 52 5z"></label><label>Warna <input type="color" data-c value="#e07fb5"></label></div><div class="stage" style="display:grid;place-items:center"><svg viewBox="0 0 120 70" width="240" aria-hidden="true"><path data-p fill="#e07fb5" stroke="#bf3f89" stroke-width="3" stroke-linejoin="round"/></svg></div><p style="margin:0">Huruf perintah: <b>M</b> pindah ke titik, <b>L</b> garis, <b>C</b> kurva Bezier (2 titik kendali + tujuan), <b>Q</b> kurva 1 titik kendali, <b>Z</b> tutup bentuk. Huruf kecil = relatif dari titik sekarang.</p>',
 i(b){const f=()=>{$('[data-p]',b).setAttribute('d',$('[data-d]',b).value);$('[data-p]',b).setAttribute('fill',$('[data-c]',b).value)};b.addEventListener('input',f);f()}};
BOOK.desain={name:'Desain & Warna',desc:'Kode warna web ini, dan rahasia kenapa tampilannya bisa lucu-lucu gemes.',ch:[
{id:'ds1',t:'Resep tampilan gemes',say:'Kamu tanya <b>kenapa desainnya lucu</b>? Rahasianya cuma beberapa resep kecil yang diulang-ulang. Yuk kita bongkar!',blocks:[
 P_('Tampilan "gemes" (imut) bukan sihir. Ia dibangun dari beberapa keputusan desain yang konsisten. Berikut resep yang dipakai di web ini dan di Kebun Murojaah:'),
 T_(['Resep','Cara membuatnya di CSS','Efek'],[
  ['Sudut sangat bulat','[[border-radius: 20px]] sampai [[999px]]','Lembut, tidak tajam'],
  ['Garis tebal berwarna','[[border: 3px solid var(--line)]]','Terlihat seperti stiker/gambar tangan'],
  ['Garis putus-putus','[[border: 3px dashed ...]]','Efek jahitan'],
  ['Bayangan keras tanpa blur','[[box-shadow: 0 4px 0 warna]]','Tombol tampak tebal dan bisa ditekan'],
  ['Warna pastel','[[hsl(H 60-85% 80-95%)]]','Manis dan tenang'],
  ['Pola latar','gradien: argyle, gingham, polkadot','Hangat seperti kain'],
  ['Huruf tulisan tangan','Font Yesteryear untuk judul','Personal'],
  ['Hiasan renda & pita','radial-gradient + SVG','Seperti kerajinan'],
  ['Maskot','SVG bunny + balon ucapan','Ada "teman" yang menemani'],
  ['Gerakan kecil','[[transform]] saat disentuh','Terasa hidup']]),
 N_('tip','Aturan emas','Pilih <b>sedikit</b> resep, lalu pakai <b>konsisten</b> di semua tempat. Kalau semua tombol bulat, semua garis tebal, semua warna dari satu palet: hasilnya terasa seperti satu dunia.'.split('|')),
 D_('bentuk'),
 G_({code:'<style>\n  .tombol { padding: 8px 22px; background: #fff; color: #3b3585; border: 1px solid #999; }\n</style>\n<button class="tombol">Klik aku</button>',goal:'ubah jadi gemes: [[border-radius]] ≥ 20px, garis [[3px dashed]] dan [[box-shadow]] keras (blur 0).',check:(d)=>{const c=getComputedStyle(d.querySelector('.tombol'));return parseFloat(c.borderTopLeftRadius)>=20&&c.borderTopStyle==='dashed'&&parseFloat(c.borderTopWidth)>=3&&/0px 0px|\d+px 0px/.test(c.boxShadow.replace(/rgb[^)]*\)\s*/,''))&&c.boxShadow!=='none'},sol:'<style>\n .tombol{padding:8px 22px;background:#fff;color:#3b3585;border:3px dashed hotpink;border-radius:999px;box-shadow:0 4px 0 hotpink}\n</style>\n<button class="tombol">Klik aku</button>'}),
 Z_('Bayangan keras (tanpa blur) membuat tombol terlihat...',['Buram','Tebal seperti stiker','Hilang','Berubah warna'],1,'Blur 0 menjaga tepi bayangan tajam sehingga tampak seperti sisi tebal.')]},
{id:'ds2',t:'Palet warna web ini (kode hex)',say:'Ini daftar warna yang kupakai, lengkap dengan <b>kode hex</b> dan fungsinya. Ganti tema, kodenya ikut berubah!',blocks:[
 P_('Semua warna web ini berupa <b>variabel</b>. Tiap tema hanya mengganti tiga angka corak (hue): utama, aksen, dan pelengkap. Warna lainnya dihitung dari situ. Di bawah adalah warna <b>tema aktif</b> kamu.'),
 D_('palet'),
 H_('Warna tema bawaan Lavender Pita'),
 T_(['Peran','Hex perkiraan','Rumus'],[['Latar halaman','#B9A9EC','hsl(255 62% 78%)'],['Latar bingkai','#F4F0FF','hsl(255 100% 97%)'],['Teks utama','#3B3585','hsl(255 45% 27%)'],['Garis','#6D65C8','hsl(255 50% 52%)'],['Aksen pink','#E07FB5','hsl(330 65% 66%)'],['Tombol utama','#C0408A','hsl(330 62% 48%)'],['Latar pink muda','#FBD3E8','hsl(330 85% 91%)'],['Biru muda','#D3DCFB','hsl(225 75% 91%)']]),
 N_('tip','Kenapa hex tidak tertulis permanen?','Karena ditulis dengan [[hsl(var(--hm) ...)]]: satu angka hue [[--hm]] mengendalikan semuanya. Itu sebabnya ada 21 tema tanpa menulis 21 palet manual.'.split('|')),
 Z_('Tema baru bisa dibuat hanya dengan mengganti...',['Semua kode hex satu per satu','Tiga angka hue (--hm, --ha, --hb)','Font','Ukuran layar'],1,'Karena semua warna diturunkan lewat [[hsl()]] dari tiga hue.')]},
{id:'ds3',t:'HSL & membuat palet sendiri',say:'HSL itu cara menulis warna yang <b>masuk akal</b>: corak, kepekatan, terang. Cocok untuk menyusun palet serasi.',blocks:[
 T_(['Bagian','Rentang','Arti'],[['H (Hue)','0-360','corak di roda warna: 0 merah, 60 kuning, 120 hijau, 180 sian, 240 biru, 300 magenta'],['S (Saturation)','0-100%','kepekatan: 0 abu-abu, 100 menyala'],['L (Lightness)','0-100%','terang: 0 hitam, 50 normal, 100 putih']]),
 P_('Resep pastel: S sekitar 60-85%, L sekitar 80-95%. Resep teks gelap yang serasi: hue sama, S 40-50%, L 25-30%. Itulah kenapa semua warna web ini terlihat satu keluarga: hue sama, terang berbeda.'),
 D_('palgen'),
 G_({code:'<style>\n  :root { --h: 330; }\n  .a { background: hsl(var(--h) 85% 90%); border: 3px solid hsl(var(--h) 50% 50%); padding: 20px; border-radius: 16px; color: hsl(var(--h) 45% 25%); }\n</style>\n<div class="a">Ganti angka --h</div>',goal:'ubah [[--h]] menjadi corak hijau (antara 90 dan 160) dan lihat seluruh kartu ikut berubah.',check:(d,l,c)=>{const m=/--h\s*:\s*(\d+)/.exec(c);return !!m&&+m[1]>=90&&+m[1]<=160},sol:'<style>\n :root{--h:140}\n .a{background:hsl(var(--h) 85% 90%);border:3px solid hsl(var(--h) 50% 50%);padding:20px;border-radius:16px;color:hsl(var(--h) 45% 25%)}\n</style>\n<div class="a">Ganti angka --h</div>'}),
 Z_('Untuk warna pastel, nilai L (lightness) biasanya...',['10-20%','80-95%','50%','0%'],1,'Pastel = terang dan lembut.')]},
{id:'ds4',t:'Pola latar: argyle, gingham, polkadot',say:'Latar berpola tanpa satu pun file gambar! Semuanya <b>gradien</b> dan SVG kecil yang diulang.',blocks:[
 P_('Ide dasarnya: buat satu "ubin" kecil, lalu ulangi dengan [[background-size]]. Gradien CSS membuat ubin tanpa unduhan apa pun.'),
 A_('pola.css','css',[
  ['/* Argyle: belah ketupat */','Kita ingin diamond bersilangan.'],
  ['background-image: repeating-conic-gradient(from 45deg, #a597e2 0 25%, transparent 0 50%);','Gradien kerucut berselang-seling terisi-kosong tiap seperempat lingkaran.','Menghasilkan kotak diagonal berselang (belah ketupat).','Pola argyle tema Lavender.'],
  ['background-size: 150px 150px;','Ukuran satu ubin.','Memperbesar/memperkecil pola.','Atur kerapatan.'],
  ['/* Polkadot */'],
  ['background-image: radial-gradient(#fff 4px, transparent 4.5px), radial-gradient(#fff 4px, transparent 4.5px);','Dua lapis titik.','Lingkaran kecil bertepi tajam.','Dua lapis agar bisa digeser.'],
  ['background-size: 40px 40px; background-position: 0 0, 20px 20px;','Lapis kedua digeser setengah ubin.','Titik tersusun zig-zag.','Terlihat lebih alami daripada satu lapis.'],
  ['/* Gingham: kotak-kotak */'],
  ['background-image: linear-gradient(90deg, rgba(224,127,181,.5) 50%, transparent 0), linear-gradient(rgba(224,127,181,.5) 50%, transparent 0);','Garis tegak dan datar semi transparan.','Bagian yang bertumpuk jadi lebih pekat.','Efek taplak kotak-kotak.'],
  ['background-size: 44px 44px;']]),
 D_('pola'),
 G_({code:'<style>\n  .p { height: 140px; border-radius: 16px; background-color: #fdeaf4; }\n</style>\n<div class="p"></div>',goal:'buat pola garis diagonal: [[repeating-linear-gradient(45deg, ...)]] pada [[.p]].',check:(d)=>/repeating-linear-gradient/.test(getComputedStyle(d.querySelector('.p')).backgroundImage),sol:'<style>\n .p{height:140px;border-radius:16px;background-color:#fdeaf4;background-image:repeating-linear-gradient(45deg,#e07fb5 0 12px,transparent 12px 24px)}\n</style>\n<div class="p"></div>'}),
 Z_('Kenapa polkadot dibuat dua lapis yang digeser?',['Biar berat','Supaya titik tersusun zig-zag, bukan kotak lurus','Aturan CSS','Biar berwarna'],1,'Lapis kedua digeser setengah ubin.')]},
{id:'ds5',t:'Renda, pita & kerajinan lainnya',say:'Tepi renda, pita, doily, dan balon ucapan: semuanya bisa dibuat dengan CSS dan SVG. Aku jelaskan satu-satu.',blocks:[
 H_('Tepi renda (scallop)'),
 P_('Lingkaran setengah yang diulang di sepanjang tepi. Dibuat dengan [[radial-gradient]] yang pusat lingkarannya tepat di tepi atas:'),
 D_('renda'),
 H_('Garis belang header'),
 C_('belang.css','css','background: repeating-linear-gradient(90deg, #c9bdf5 0 26px, #ddd3fb 26px 52px);\n/* 0-26px warna A, 26-52px warna B, lalu diulang */'),
 H_('Lengkungan putih berpita (arch)'),
 C_('arch.css','css','.arch{\n  border: 3px solid var(--line);\n  border-bottom: 0;\n  border-radius: 340px 340px 0 0 / 150px 150px 0 0;\n  /* dua angka dipisah garis miring = lengkung elips (lebar / tinggi) */\n}'),
 H_('Pita dan doily dengan SVG'),
 P_('Pita di atas judul adalah dua bentuk kurva Bezier yang dicerminkan, dua pita menjuntai, dan simpul berkancing. Doily (taplak renda) adalah 12 lingkaran putih melingkar. Coba ubah path di bawah untuk memahami cara kerja kurva:'),
 D_('svgp'),
 A_('pita.svg','html',[
  ['<svg viewBox="0 0 120 70">','Koordinat gambar 120x70, membesar/mengecil otomatis.','Kanvas SVG.','Gambar tajam di ukuran apa pun.'],
  ['  <path d="M60 35C42 8 8 4 8 30s32 28 52 5z" fill="pink" stroke="deeppink" stroke-width="3"/>','Sayap kiri pita.','Mulai di tengah (60,35), kurva Bezier ke kiri-atas, kembali dengan kurva halus [[s]], lalu tutup [[z]].','Bentuk lonjong membulat.'],
  ['  <path d="M60 35C78 8 112 4 112 30S80 58 60 35z" .../>','Sayap kanan = cermin kiri.','Koordinat x dicerminkan.','Simetris.'],
  ['  <circle cx="60" cy="35" r="11" fill="lightblue"/>','Simpul/kancing di tengah.','Lingkaran.','Titik fokus.'],
  ['</svg>']]),
 Z_('Untuk menggambar setengah lingkaran bergelombang di tepi, kita memakai...',['[[radial-gradient]] yang diulang di sumbu x','Gambar PNG','[[<marquee>]]','[[float]]'],0,'Lingkaran di tepi atas diulang dengan [[repeat-x]].')]},
{id:'ds6',t:'Tipografi & maskot',say:'Dua hal yang bikin web terasa punya "kepribadian": huruf dan teman kecil seperti aku!',blocks:[
 T_(['Peran','Font di web ini','Kenapa'],[['Judul','Yesteryear (tulisan tangan)','Personal, seperti papan kecil'],['Isi','Nunito (bulat, ramah)','Mudah dibaca, ujung huruf membulat senada dengan bentuk'],['Kode','JetBrains Mono','Setiap huruf sama lebar, ada pembeda l/1/I dan 0/O']]),
 C_('font.html','html','<link rel="preconnect" href="https://fonts.googleapis.com">\n<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Yesteryear&display=swap" rel="stylesheet">\n<style>\n  body{ font-family:"Nunito", system-ui, sans-serif }\n  h1{ font-family:"Yesteryear", "Brush Script MT", cursive }\n</style>'),
 H_('Maskot & balon ucapan'),
 P_('Maskot Pita adalah SVG: lingkaran putih (wajah), dua elips (telinga), dua lingkaran kecil (mata), dua elips pink (pipi), kurva senyum, dan pita. Balon ucapan adalah kotak membulat dengan ekor dari kotak kecil yang diputar 45 derajat:'),
 C_('balon.css','css','.bub{ position:relative; border:3px solid var(--pink); border-radius:20px; background:var(--pinkbg2); padding:10px 14px }\n.bub::before{                    /* ekor balon */\n  content:""; position:absolute; left:-12px; bottom:18px;\n  width:18px; height:18px; background:var(--pinkbg2);\n  border-left:3px solid var(--pink); border-bottom:3px solid var(--pink);\n  transform:rotate(45deg);       /* kotak diputar jadi segitiga */\n}'),
 N_('tip','Prinsip konsistensi','Mata, pipi, dan garis maskot memakai warna yang sama dengan tema web (variabel CSS), jadi ketika tema berganti, Pita ikut berganti warna pita-nya.'.split('|')),
 Z_('Kenapa font kode dibuat monospace?',['Biar kecil','Setiap huruf sama lebar sehingga kode sejajar dan mudah dibaca','Karena gratis','Aturan HTML'],1,'Perataan kolom dan pembeda karakter mirip penting untuk kode.')]}
]};
